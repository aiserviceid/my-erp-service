name: WA Marketing AI Composer

on:
  push:
    branches:
      - agent/wa-marketing-ai-composer
    paths:
      - scripts/apply-wa-marketing-ai.py
      - .github/workflows/wa-marketing-ai.yml

permissions:
  contents: write

jobs:
  verify-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/wa-marketing-ai-composer
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply backend and admin patches
        run: python3 scripts/apply-wa-marketing-ai.py

      - name: Dynamic variable smoke tests
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { CAMPAIGN_VARIABLES, findUnknownCampaignVariables, renderCampaignTemplate } from './src/config/waTemplates.js';

          const output = renderCampaignTemplate(
            'Halo {nama_pelanggan} dari {nama_toko}. Resi {resi}. Total {biaya}.',
            { nama_pelanggan: 'Budi', nama_toko: 'UnitPro', resi: 'TRX-1', biaya: 350000 }
          );
          assert.match(output, /Halo Budi/);
          assert.match(output, /UnitPro/);
          assert.match(output, /TRX-1/);
          assert.match(output, /Rp 350\.000/);
          assert.equal(CAMPAIGN_VARIABLES.some((item) => item.token === '{link_tracking}'), true);
          assert.deepEqual(findUnknownCampaignVariables('Halo {nama_pelanggan} {variabel_salah}'), ['{variabel_salah}']);
          console.log('Dynamic campaign variable tests passed.');
          NODE

      - name: Server syntax and integration guards
        shell: bash
        run: |
          node --check server/index.cjs
          grep -q "app.post('/api/whatsapp/send'" server/index.cjs
          grep -q "app.post('/api/ai/copywriting'" server/index.cjs
          grep -q "gemini-3.6-flash" server/index.cjs
          grep -q "GEMINI_API_KEY" server/index.cjs
          grep -q "sendWhatsAppNotification" src/components/CustomerCRMInsights.jsx
          grep -q "Buat Copywriting dengan Gemini" src/components/CustomerCRMInsights.jsx
          grep -q "Tutorial 1 Menit" src/components/CustomerCRMInsights.jsx
          grep -q "Token WhatsApp Gateway (Fonnte)" src/pages/AdminDashboard.jsx
          ! grep -q "CAMPAIGN_TEMPLATES" src/components/CustomerCRMInsights.jsx
          ! grep -q "Library Campaign Template" src/components/CustomerCRMInsights.jsx
          ! grep -q "window.open(.*cust.phone" src/components/CustomerCRMInsights.jsx

      - name: Install dependencies
        run: npm ci

      - name: Build production app
        run: npm run build

      - name: Commit verified source changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/index.cjs src/pages/AdminDashboard.jsx
          git commit -m "feat(marketing): add Gemini copywriting and gateway proxy"
          git push origin HEAD:agent/wa-marketing-ai-composer
