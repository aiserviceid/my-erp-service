name: Prepare UnitPro v1.2.11

on:
  push:
    branches:
      - release/v1.2.11-service-flow
    paths:
      - .github/workflows/prepare-v1.2.11.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.2.11-service-flow
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Bump application version
        run: |
          npm version 1.2.11 --no-git-tag-version
          python - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle')
          text = path.read_text(encoding='utf-8')
          text = text.replace('versionCode 9', 'versionCode 10', 1)
          text = text.replace('versionName "1.2.6"', 'versionName "1.2.11"', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify web build
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Commit release metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/prepare-v1.2.11.yml
          git add package.json package-lock.json android/app/build.gradle
          git commit -m "release: bump UnitPro Android to v1.2.11"
          git push origin HEAD:release/v1.2.11-service-flow
