name: Finance Guard

on:
  push:
    branches:
      - agent/finance-guard

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finance-guard
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply finance guard patch
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly 1 match for {label}, found {count}")
              return text.replace(old, new, 1)

          employee_path = Path('src/pages/EmployeePortal.jsx')
          employee = employee_path.read_text()

          employee = replace_once(
              employee,
              "                                } else if (newStatus === 'DI AMBIL') {",
              "                                } else if (newStatus === 'DIAMBIL' || newStatus === 'DI AMBIL') {",
              'pickup status branch'
          )

          employee = replace_once(
              employee,
              "                                        status: newStatus,",
              "                                        status: 'DIAMBIL',",
              'canonical pickup status save'
          )

          old_payment_block = """                                      if (jasaAfterDiscount > 0 || (jasaFee === 0 && partFee === 0)) {
                                        await apiService.post('/transactions', {
                                          tenant_code: employee.tenant_code || tenant.code,
                                          type: 'INCOME_JASA',
                                          amount: jasaAfterDiscount,
                                          description: `Jasa Servis Resi ${s.resi} (${s.customer_name})`
                                        });
                                      }
                                      if (partFee > 0) {
                                        await apiService.post('/transactions', {
                                          tenant_code: employee.tenant_code || tenant.code,
                                          type: 'INCOME_SPAREPART',
                                          amount: partFee,
                                          description: `Sparepart Servis Resi ${s.resi} (${s.customer_name})`
                                        });
                                      }
                                      fetchServices();"""

          new_payment_block = """                                      const tenantCode = employee.tenant_code || tenant.code;
                                      const latestTransactions = await apiService.get(`/transactions/${tenantCode}`).catch(() => transactions);
                                      const existingServiceIncome = latestTransactions.filter((transaction) => {
                                        const type = String(transaction.type || '');
                                        const description = String(transaction.description || '');
                                        return ['INCOME', 'INCOME_JASA', 'INCOME_SPAREPART'].includes(type) && description.includes(`Resi ${s.resi}`);
                                      });

                                      if (existingServiceIncome.length > 0) {
                                        alert(`Pelunasan resi ${s.resi} sudah pernah tercatat di keuangan. Transaksi tidak dibuat ulang agar omzet tidak dobel.`);
                                      } else {
                                        if (jasaAfterDiscount > 0 || (jasaFee === 0 && partFee === 0)) {
                                          await apiService.post('/transactions', {
                                            tenant_code: tenantCode,
                                            type: 'INCOME_JASA',
                                            amount: jasaAfterDiscount,
                                            description: `Jasa Servis Resi ${s.resi} (${s.customer_name})`
                                          });
                                        }
                                        if (partFee > 0) {
                                          await apiService.post('/transactions', {
                                            tenant_code: tenantCode,
                                            type: 'INCOME_SPAREPART',
                                            amount: partFee,
                                            description: `Sparepart Servis Resi ${s.resi} (${s.customer_name})`
                                          });
                                        }
                                      }
                                      fetchServices();"""

          employee = replace_once(employee, old_payment_block, new_payment_block, 'service income duplicate guard')
          employee_path.write_text(employee)

          admin_path = Path('src/pages/AdminDashboard.jsx')
          admin = admin_path.read_text()

          admin = replace_once(
              admin,
              "                          {t.type === 'INCOME' && <span className=\"badge badge-success\">Pendapatan Servis</span>}",
              "                          {(t.type === 'INCOME' || t.type === 'INCOME_JASA') && <span className=\"badge badge-success\">Pendapatan Jasa Servis</span>}\n                          {t.type === 'INCOME_SPAREPART' && <span className=\"badge badge-success\">Pendapatan Sparepart Servis</span>}",
              'finance table income badges'
          )

          admin = replace_once(
              admin,
              "                        <td style={{ color: t.type === 'INCOME' || t.type === 'POS_SALES' ? 'var(--accent)' : '#ef4444', fontWeight: 'bold' }}>",
              "                        <td style={{ color: String(t.type || '').startsWith('INCOME') || t.type === 'POS_SALES' ? 'var(--accent)' : '#ef4444', fontWeight: 'bold' }}>",
              'finance table income color'
          )

          admin = replace_once(
              admin,
              "                          {t.type === 'INCOME' || t.type === 'POS_SALES' ? '+' : '-'} Rp {t.amount?.toLocaleString('id-ID')}",
              "                          {String(t.type || '').startsWith('INCOME') || t.type === 'POS_SALES' ? '+' : '-'} Rp {t.amount?.toLocaleString('id-ID')}",
              'finance table income sign'
          )
          admin_path.write_text(admin)

          Path('.github/workflows/temp-finance-guard.yml').unlink(missing_ok=True)
          PY
      - name: Validate build
        run: |
          npm ci
          npm run build
      - name: Commit source changes
        run: |
          git config user.name "aiserviceid"
          git config user.email "ai.interiorid@gmail.com"
          git add src/pages/EmployeePortal.jsx src/pages/AdminDashboard.jsx
          git add -u .github/workflows/temp-finance-guard.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: guard service finance entries"
          git push
