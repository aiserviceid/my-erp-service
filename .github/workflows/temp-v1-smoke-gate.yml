name: V1 Smoke Gate

on:
  push:
    branches:
      - agent/v1-stabilization-integration

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1-stabilization-integration
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Build production bundle
        run: npm run build
      - name: Run smoke test
        run: npm run smoke:v1
      - name: Cleanup temporary smoke workflow
        if: always()
        run: |
          git config user.name "aiserviceid"
          git config user.email "ai.interiorid@gmail.com"
          rm -f .github/workflows/temp-v1-smoke-gate.yml .github/v1-smoke-trigger.txt
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup needed"
            exit 0
          fi
          git commit -m "chore: remove v1 smoke gate workflow"
          git push
