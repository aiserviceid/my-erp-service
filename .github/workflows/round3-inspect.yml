name: Round3 Inspect

on:
  push:
    branches:
      - agent/fix-operational-blockers-round3
    paths:
      - .github/workflows/round3-inspect.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-operational-blockers-round3
      - name: Inspect operational blocker code
        shell: bash
        run: |
          echo '=== EMPLOYEE PORTAL: KASBON ==='
          grep -n -B 20 -A 45 "const handleBon" src/pages/EmployeePortal.jsx || true
          echo '=== EMPLOYEE PORTAL: DIAMBIL ==='
          grep -n -B 35 -A 110 "Tandai barang diambil" src/pages/EmployeePortal.jsx || true
          echo '=== ADMIN: KASBON TABLE ==='
          grep -n -B 25 -A 100 "empTab === 'kasbon'" src/pages/AdminDashboard.jsx || true
          echo '=== ADMIN: KASBON NOTIFICATION ==='
          grep -n -B 20 -A 80 "KASBON APPROVAL NOTIFICATION" src/pages/AdminDashboard.jsx || true
          echo '=== API: GENERIC TRANSACTION/SERVICE ==='
          grep -n -B 25 -A 130 "Generic Dispatcher" src/services/api.js || true
          echo '=== FINANCE: BON TYPES ==='
          grep -RIn -B 4 -A 10 "BON_KARYAWAN\|BON_PENDING\|BON_REJECTED" src/components src/pages | head -n 350 || true
          echo '=== FORMATTERS / 0rb ==='
          grep -RIn "0rb\|formatRupiahAxis" src | head -n 200 || true
          echo '=== ISSUE CHIPS ==='
          cat src/components/IssueChips.jsx || true
          grep -RIn "issue-chip\|service-issue" src/index.css src/unitpro-ui-polish.css 2>/dev/null | head -n 200 || true
