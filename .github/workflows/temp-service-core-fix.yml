name: Apply Service Core Fix

on:
  push:
    branches:
      - agent/service-core-fix

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply service core patch
        shell: bash
        run: |
          cat > /tmp/service_core_patch.py <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label, path):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 match for {label}, found {count}')
              return text.replace(old, new, 1)

          for rel in ['src/pages/AdminDashboard.jsx', 'src/pages/EmployeePortal.jsx']:
              path = Path(rel)
              text = path.read_text(encoding='utf-8')
              text = text.replace("status: 'DITERIMA'", "status: 'PROSES'")

              old_handler = "    const partFee = normalizeMoneyInput(fd.get('part_fee'));\n    const jasaFee = normalizeMoneyInput(fd.get('jasa_fee'));\n    const discount = normalizeMoneyInput(fd.get('discount'));\n"
              new_handler = "    const note = String(fd.get('note') || '').trim();\n    const partFee = normalizeMoneyInput(fd.get('part_fee'));\n    const jasaFee = normalizeMoneyInput(fd.get('jasa_fee'));\n    const discount = normalizeMoneyInput(fd.get('discount'));\n"
              text = replace_once(text, old_handler, new_handler, 'read note in edit nota handler', rel)

              old_issue = "    const updatedIssue = buildIssueWithDiscount(selectedService.issue || '', discount);\n"
              new_issue = "    const updatedIssue = buildIssueWithDiscount(note || selectedService.issue || '', discount);\n"
              text = replace_once(text, old_issue, new_issue, 'build issue from editable note', rel)

              old_modal = "            <p style={{ fontSize: '0.85rem', color: '#64748b', marginBottom: '14px' }}>Resi: <strong>{selectedService.resi}</strong></p>\n            <label className=\"label\">Biaya Sparepart (Rp)</label>\n"
              new_modal = "            <p style={{ fontSize: '0.85rem', color: '#64748b', marginBottom: '14px' }}>Resi: <strong>{selectedService.resi}</strong></p>\n            <label className=\"label\">Keterangan / Rincian Perbaikan</label>\n            <textarea\n              name=\"note\"\n              className=\"input-field\"\n              rows=\"4\"\n              defaultValue={buildIssueWithDiscount(selectedService.issue || '', 0)}\n              placeholder=\"Contoh: Ganti LCD, cleaning konektor, unit normal kembali\"\n              style={{ marginBottom: '10px', resize: 'vertical' }}\n            />\n            <label className=\"label\">Biaya Sparepart (Rp)</label>\n"
              text = replace_once(text, old_modal, new_modal, 'edit nota note textarea', rel)

              old_payload = "      const updatedService = await apiService.post('/services/update', {\n        resi: selectedService.resi,\n        part_fee: partFee,\n        jasa_fee: jasaFee,\n        issue: updatedIssue\n      });\n"
              if rel.endswith('AdminDashboard.jsx'):
                  new_payload = "      const updatedService = await apiService.post('/services/update', {\n        resi: selectedService.resi,\n        tenant_code: selectedService.tenant_code || tenant?.code,\n        part_fee: partFee,\n        jasa_fee: jasaFee,\n        issue: updatedIssue\n      });\n"
              else:
                  new_payload = "      const updatedService = await apiService.post('/services/update', {\n        resi: selectedService.resi,\n        tenant_code: selectedService.tenant_code || tenant?.code || employee?.tenant_code,\n        part_fee: partFee,\n        jasa_fee: jasaFee,\n        issue: updatedIssue\n      });\n"
              text = replace_once(text, old_payload, new_payload, 'tenant scoped edit nota update payload', rel)
              path.write_text(text, encoding='utf-8')

          api_path = Path('src/services/api.js')
          text = api_path.read_text(encoding='utf-8')
          old_api = "      if (endpoint === '/services/update') {\n        const { resi, ...updates } = body;\n        const { data, error } = await supabase.from('services').update(updates).eq('resi', resi).select().single();\n        if (error) throw error;\n        return data;\n      }\n"
          new_api = "      if (endpoint === '/services/update') {\n        const { resi, tenant_code, ...updates } = body;\n        let query = supabase.from('services').update(updates).eq('resi', resi);\n        if (tenant_code) query = query.eq('tenant_code', tenant_code);\n        const { data, error } = await query.select().single();\n        if (error) throw error;\n        return data;\n      }\n"
          text = replace_once(text, old_api, new_api, 'tenant scoped apiService services/update', 'src/services/api.js')
          api_path.write_text(text, encoding='utf-8')
          PY
          python /tmp/service_core_patch.py

      - name: Validate build
        run: |
          npm ci
          npm run build

      - name: Commit source changes
        shell: bash
        run: |
          rm .github/workflows/temp-service-core-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AdminDashboard.jsx src/pages/EmployeePortal.jsx src/services/api.js .github/workflows/temp-service-core-fix.yml
          git commit -m "feat: fix service core nota workflow"
          git push origin HEAD:agent/service-core-fix
