name: Apply Service Core Fix

on:
  push:
    branches:
      - agent/service-core-fix

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply service core patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label, path):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 match for {label}, found {count}')
              return text.replace(old, new, 1)

          # 1) Admin + Employee: status awal servis harus mengikuti source of truth: PROSES.
          for rel in ['src/pages/AdminDashboard.jsx', 'src/pages/EmployeePortal.jsx']:
              path = Path(rel)
              text = path.read_text(encoding='utf-8')
              text = text.replace("status: 'DITERIMA'", "status: 'PROSES'")

              old_handler = """    const partFee = normalizeMoneyInput(fd.get('part_fee'));
    const jasaFee = normalizeMoneyInput(fd.get('jasa_fee'));
    const discount = normalizeMoneyInput(fd.get('discount'));
"""
              new_handler = """    const note = String(fd.get('note') || '').trim();
    const partFee = normalizeMoneyInput(fd.get('part_fee'));
    const jasaFee = normalizeMoneyInput(fd.get('jasa_fee'));
    const discount = normalizeMoneyInput(fd.get('discount'));
"""
              text = replace_once(text, old_handler, new_handler, 'read note in edit nota handler', rel)

              old_issue = """    const updatedIssue = buildIssueWithDiscount(selectedService.issue || '', discount);
"""
              new_issue = """    const updatedIssue = buildIssueWithDiscount(note || selectedService.issue || '', discount);
"""
              text = replace_once(text, old_issue, new_issue, 'build issue from editable note', rel)

              old_modal = """            <p style={{ fontSize: '0.85rem', color: '#64748b', marginBottom: '14px' }}>Resi: <strong>{selectedService.resi}</strong></p>
            <label className=\"label\">Biaya Sparepart (Rp)</label>
"""
              new_modal = """            <p style={{ fontSize: '0.85rem', color: '#64748b', marginBottom: '14px' }}>Resi: <strong>{selectedService.resi}</strong></p>
            <label className=\"label\">Keterangan / Rincian Perbaikan</label>
            <textarea
              name=\"note\"
              className=\"input-field\"
              rows=\"4\"
              defaultValue={buildIssueWithDiscount(selectedService.issue || '', 0)}
              placeholder=\"Contoh: Ganti LCD, cleaning konektor, unit normal kembali\"
              style={{ marginBottom: '10px', resize: 'vertical' }}
            />
            <label className=\"label\">Biaya Sparepart (Rp)</label>
"""
              text = replace_once(text, old_modal, new_modal, 'edit nota note textarea', rel)

              old_payload = """      const updatedService = await apiService.post('/services/update', {
        resi: selectedService.resi,
        part_fee: partFee,
        jasa_fee: jasaFee,
        issue: updatedIssue
      });
"""
              if rel.endswith('AdminDashboard.jsx'):
                  new_payload = """      const updatedService = await apiService.post('/services/update', {
        resi: selectedService.resi,
        tenant_code: selectedService.tenant_code || tenant?.code,
        part_fee: partFee,
        jasa_fee: jasaFee,
        issue: updatedIssue
      });
"""
              else:
                  new_payload = """      const updatedService = await apiService.post('/services/update', {
        resi: selectedService.resi,
        tenant_code: selectedService.tenant_code || tenant?.code || employee?.tenant_code,
        part_fee: partFee,
        jasa_fee: jasaFee,
        issue: updatedIssue
      });
"""
              text = replace_once(text, old_payload, new_payload, 'tenant scoped edit nota update payload', rel)

              path.write_text(text, encoding='utf-8')

          # 2) apiService: /services/update harus tenant-scoped bila tenant_code tersedia,
          #    dan tenant_code tidak boleh ikut ditulis sebagai field update.
          api_path = Path('src/services/api.js')
          text = api_path.read_text(encoding='utf-8')
          old_api = """      if (endpoint === '/services/update') {
        const { resi, ...updates } = body;
        const { data, error } = await supabase.from('services').update(updates).eq('resi', resi).select().single();
        if (error) throw error;
        return data;
      }
"""
          new_api = """      if (endpoint === '/services/update') {
        const { resi, tenant_code, ...updates } = body;
        let query = supabase.from('services').update(updates).eq('resi', resi);
        if (tenant_code) query = query.eq('tenant_code', tenant_code);
        const { data, error } = await query.select().single();
        if (error) throw error;
        return data;
      }
"""
          text = replace_once(text, old_api, new_api, 'tenant scoped apiService services/update', 'src/services/api.js')
          api_path.write_text(text, encoding='utf-8')

          # 3) Backend fallback endpoint: izinkan koreksi biaya/status + tenant scope bila dikirim.
          server_path = Path('server/index.cjs')
          text = server_path.read_text(encoding='utf-8')
          old_server = """app.post('/api/services/update', (req, res) => {
  const { resi, technician_id, issue } = req.body;
  if (!resi) return res.status(400).json({ error: 'Resi wajib diisi' });
  db.run(
    'UPDATE services SET technician_id = COALESCE(?, technician_id), issue = COALESCE(?, issue) WHERE resi = ?',
    [technician_id, issue, resi],
    (err) => {
      if (err) return res.status(500).json({ error: err.message });
      res.json({ success: true });
    }
  );
});
"""
          new_server = """app.post('/api/services/update', (req, res) => {
  const { resi, tenant_code, technician_id, issue, status, part_fee, jasa_fee } = req.body;
  if (!resi) return res.status(400).json({ error: 'Resi wajib diisi' });
  const tenantWhere = tenant_code ? ' AND tenant_code = ?' : '';
  const params = [status, part_fee, jasa_fee, technician_id, issue, resi];
  if (tenant_code) params.push(tenant_code);
  db.run(
    `UPDATE services SET status = COALESCE(?, status), part_fee = COALESCE(?, part_fee), jasa_fee = COALESCE(?, jasa_fee), technician_id = COALESCE(?, technician_id), issue = COALESCE(?, issue) WHERE resi = ?${tenantWhere}`,
    params,
    function(err) {
      if (err) return res.status(500).json({ error: err.message });
      if (this.changes === 0) return res.status(404).json({ error: 'Servis tidak ditemukan atau bukan milik toko ini' });
      res.json({ success: true });
    }
  );
});
"""
          text = replace_once(text, old_server, new_server, 'backend services/update tenant-scoped correction', 'server/index.cjs')
          server_path.write_text(text, encoding='utf-8')
          PY

      - name: Validate build
        run: |
          npm ci
          npm run build

      - name: Commit source changes
        shell: bash
        run: |
          rm .github/workflows/temp-service-core-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AdminDashboard.jsx src/pages/EmployeePortal.jsx src/services/api.js server/index.cjs .github/workflows/temp-service-core-fix.yml
          git commit -m "feat: fix service core nota workflow"
          git push origin HEAD:agent/service-core-fix
