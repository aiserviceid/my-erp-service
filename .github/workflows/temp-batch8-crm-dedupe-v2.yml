name: Batch 8 CRM Dedupe V2

on:
  push:
    paths:
      - '.github/workflows/temp-batch8-crm-dedupe-v2.yml'
      - '.github/batch8-crm-dedupe-v2-trigger.txt'

permissions:
  contents: write

jobs:
  patch_build_clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1-stabilization-integration
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Remove duplicated old CRM metric cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('src/pages/AdminDashboard.jsx')
          text = path.read_text()
          pattern = r"\n\s*\{/\* CRM Metrics Cards \*/\}\n\s*<div className=\"customer-metric-grid\"[\s\S]*?\n\s*\{/\* WA BLAST CAMPAIGN GENERATOR BOX \*/\}"
          new_text, count = re.subn(pattern, "\n\n            {/* WA BLAST CAMPAIGN GENERATOR BOX */}", text, count=1)
          if count == 0:
              # Already clean: do not fail the build.
              print('Old CRM metric block not found; assuming already clean.')
              new_text = text
          new_text = new_text.replace("            {/* TABEL DATABASE PELANGGAN */}\n            {/* TABEL DATABASE PELANGGAN */}", "            {/* TABEL DATABASE PELANGGAN */}")
          path.write_text(new_text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit source and clean
        run: |
          git config user.name "aiserviceid"
          git config user.email "ai.interiorid@gmail.com"
          git add src/pages/AdminDashboard.jsx
          git commit -m "fix: remove duplicated customer crm cards" || echo "No source changes"
          git rm -f .github/workflows/temp-batch8-crm-dedupe.yml .github/batch8-crm-dedupe-trigger.txt .github/workflows/temp-batch8-crm-dedupe-v2.yml .github/batch8-crm-dedupe-v2-trigger.txt
          git commit -m "chore: clean batch 8 crm dedupe workflows"
          git push origin agent/v1-stabilization-integration
