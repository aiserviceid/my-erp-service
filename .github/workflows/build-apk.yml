name: Build Android APK & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read App Version
        id: app_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Dependencies & Build Web
        run: |
          npm install
          npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Build Release APK
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Name APK for Distribution
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "android/app/build/outputs/apk/release/UnitPro-Android-v${{ steps.app_version.outputs.version }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnitPro-v${{ steps.app_version.outputs.version }}-apk
          path: android/app/build/outputs/apk/release/UnitPro-Android-v${{ steps.app_version.outputs.version }}.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.app_version.outputs.version }}
          name: "Rilis v${{ steps.app_version.outputs.version }} UnitPro"
          body: "Unduh file APK Android resmi UnitPro v${{ steps.app_version.outputs.version }}."
          draft: false
          prerelease: false
          files: android/app/build/outputs/apk/release/UnitPro-Android-v${{ steps.app_version.outputs.version }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Stable Web APK
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p public/downloads
          cp android/app/build/outputs/apk/release/app-release.apk public/downloads/UnitPro.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/UnitPro.apk
          if git diff --cached --quiet; then
            echo "Stable APK already up to date"
          else
            git commit -m "chore: publish UnitPro v${{ steps.app_version.outputs.version }} APK [skip ci]"
            git push origin HEAD:main
          fi
