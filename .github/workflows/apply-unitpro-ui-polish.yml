name: Apply UnitPro UI Polish

on:
  push:
    branches:
      - ui/unitpro-visual-polish-20260808
    paths:
      - scripts/apply-unitpro-ui-polish.py
      - scripts/run-unitpro-ui-polish.py
      - src/components/IssueChips.jsx
      - src/components/EmployeeFinanceInsights.jsx
      - src/unitpro-ui-polish.css
      - .github/workflows/apply-unitpro-ui-polish.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[ui-polish applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ui/unitpro-visual-polish-20260808
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply deterministic UI patch
        run: python3 scripts/run-unitpro-ui-polish.py

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Commit verified UI changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AdminDashboard.jsx src/pages/EmployeePortal.jsx src/components/PremiumFinanceReport.jsx src/config/tierLimits.js src/main.jsx
          git commit -m "feat(ui): apply UnitPro visual polish [ui-polish applied]"
          git push origin HEAD:ui/unitpro-visual-polish-20260808
