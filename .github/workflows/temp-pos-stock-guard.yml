name: Apply POS Stock Guard

on:
  push:
    branches:
      - agent/pos-stock-guard

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply POS stock guard patch
        shell: bash
        run: |
          cat > /tmp/pos_stock_guard.py <<'PY'
          from pathlib import Path

          path = Path('src/components/POSView.jsx')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'POSView.jsx: expected 1 match for {label}, found {count}')
              text = text.replace(old, new, 1)

          old_precheck = """  const handleCheckout = async () => {
    if (cart.length === 0) return;
    if (paymentMethod === 'TUNAI' && cashReceivedNum < grandTotal) {"""
          new_precheck = """  const handleCheckout = async () => {
    if (cart.length === 0) return;
    const stockProblem = cart.find(item => (item.category || '').toUpperCase() !== 'JASA' && Number(item.stock || 0) < Number(item.qty || 0));
    if (stockProblem) {
      alert(`Stok ${stockProblem.name} tidak cukup. Stok tersedia: ${stockProblem.stock}, diminta: ${stockProblem.qty}.`);
      return;
    }
    if (paymentMethod === 'TUNAI' && cashReceivedNum < grandTotal) {"""
          replace_once(old_precheck, new_precheck, 'checkout stock precheck')

          old_stock = """      // 2. Update stock for each item
      const currentUser = localStorage.getItem('EMPLOYEE_NAME') || 'Kasir / Admin';
      for (const item of cart) {
        const newStock = Math.max(0, item.stock - item.qty);
        apiService.updateProduct(item.id, {
          name: item.name,
          price: item.price,
          stock: newStock,
          cost_price: item.cost_price || 0
        }, item.stock, currentUser, `Penjualan Kasir POS (${receiptData.transactionId})`).catch(() => {});
      }"""
          new_stock = """      // 2. Update stock for each physical item. Do not swallow stock failures.
      const currentUser = localStorage.getItem('EMPLOYEE_NAME') || 'Kasir / Admin';
      const stockItems = cart.filter(item => (item.category || '').toUpperCase() !== 'JASA');
      const stockUpdateResults = await Promise.allSettled(stockItems.map(item => {
        const newStock = Number(item.stock || 0) - Number(item.qty || 0);
        if (newStock < 0) {
          return Promise.reject(new Error(`Stok ${item.name} tidak cukup.`));
        }
        return apiService.updateProduct(item.id, {
          name: item.name,
          price: item.price,
          stock: newStock,
          cost_price: item.cost_price || 0
        }, item.stock, currentUser, `Penjualan Kasir POS (${receiptData.transactionId})`);
      }));
      const failedStockUpdates = stockUpdateResults.filter(result => result.status === 'rejected');
      if (failedStockUpdates.length > 0) {
        throw new Error('Transaksi tersimpan, tetapi update stok gagal. Segera koreksi stok manual sebelum lanjut transaksi berikutnya.');
      }"""
          replace_once(old_stock, new_stock, 'await stock updates')

          path.write_text(text, encoding='utf-8')
          PY
          python /tmp/pos_stock_guard.py

      - name: Validate build
        run: |
          npm ci
          npm run build

      - name: Commit source changes
        shell: bash
        run: |
          rm .github/workflows/temp-pos-stock-guard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/POSView.jsx .github/workflows/temp-pos-stock-guard.yml
          git commit -m "fix: guard POS stock updates"
          git push origin HEAD:agent/pos-stock-guard
