          <article className=\"simple-price-card partner\">
            <span className=\"simple-badge neutral\">Partner</span>
            <h3>White Label</h3>
            <p className=\"simple-price\">Rp2,5jt<span>+ setup</span></p>
            <small>Aplikasi dengan brand sendiri</small>
            <ul>
              <li><Check size={16} /> Logo, warna, domain sendiri</li>
