name: sync_packages_landing

on:
  push:
    branches:
      - agent/sync-packages-landing
    paths:
      - '.github/workflows/temp-sync-packages-landing.yml'
      - '.github/sync-packages-landing-trigger.txt'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sync-packages-landing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch packages and landing
        run: |
          cat > /tmp/sync_packages_landing.py <<'PY'
          from pathlib import Path
          import re

