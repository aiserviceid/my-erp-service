              <li><Check size={16} /> 100 produk/sparepart</li>
              <li><Check size={16} /> Nota & tracking dasar</li>
            </ul>
            <button type=\"button\" className=\"simple-btn secondary full\" onClick={registerFree}>Mulai gratis</button>
          </article>

          <article className=\"simple-price-card featured\">
            <span className=\"simple-badge\">Rekomendasi</span>
            <h3>UnitPro Pro</h3>
            <p className=\"simple-price\">Rp99.000<span>/bulan</span></p>
            <small>Untuk toko servis aktif</small>
            <ul>
              <li><Check size={16} /> Servis, kasir, stok unlimited</li>
              <li><Check size={16} /> Tim teknisi hingga 20 akun</li>
              <li><Check size={16} /> WhatsApp pelanggan & CRM</li>
              <li><Check size={16} /> Laporan owner & export Excel</li>
