          python /tmp/sync_packages_landing.py
      - name: Install dependencies
        run: npm ci
      - name: Build app
        run: npm run build
      - name: Commit changes and cleanup
        if: always()
        run: |
          git config user.name "aiserviceid"
          git config user.email "ai.interiorid@gmail.com"
          git rm --ignore-unmatch .github/workflows/temp-sync-packages-landing.yml .github/sync-packages-landing-trigger.txt
          git add src/config/tierLimits.js src/components/UnitProLogo.jsx src/pages/LandingPage.jsx src/pages/LandingPage.css
          git status --short
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "feat: sync packages and landing pricing"
          git pull --rebase origin agent/sync-packages-landing
          git push origin HEAD:agent/sync-packages-landing
