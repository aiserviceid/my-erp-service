          landing_path = Path('src/pages/LandingPage.jsx')
          landing = landing_path.read_text()
          landing = landing.replace("<UnitProLogo size={42} />", "<UnitProLogo variant=\"wordmark\" size={58} width={230} />")
          landing = landing.replace("""          <BrandLogo />
          <span>Unit<strong>Pro</strong></span>
""", """          <BrandLogo />
""")
          landing = landing.replace("""        <div className=\"simple-pricing-grid\">
          <article className=\"simple-price-card\">
            <h3>Gratis</h3>
