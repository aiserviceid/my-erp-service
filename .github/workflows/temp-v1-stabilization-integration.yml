name: V1 Stabilization Integration

on:
  push:
    branches:
      - agent/v1-stabilization-integration

jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1-stabilization-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Merge stabilization branches
        run: |
          set -euo pipefail
          git config user.name "aiserviceid"
          git config user.email "ai.interiorid@gmail.com"
          git fetch origin \
            agent/service-core-fix \
            agent/notification-service \
            agent/admin-notification-service \
            agent/security-tenant-guard \
            agent/pos-stock-guard-clean \
            agent/finance-guard \
            agent/customer-tracking-privacy \
            agent/ux-mobile-regression

          merge_branch() {
            local branch="$1"
            echo "Merging $branch"
            git merge --no-ff --no-edit "origin/$branch"
          }

          merge_branch agent/service-core-fix
          merge_branch agent/notification-service
          merge_branch agent/admin-notification-service
          merge_branch agent/security-tenant-guard
          merge_branch agent/pos-stock-guard-clean
          merge_branch agent/finance-guard
          merge_branch agent/customer-tracking-privacy
          merge_branch agent/ux-mobile-regression
      - name: Validate build
        run: |
          npm ci
          npm run build
      - name: Cleanup integration workflow
        run: |
          rm -f .github/workflows/temp-v1-stabilization-integration.yml __v1_integration_trigger__
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes"
          else
            git commit -m "chore: remove v1 integration workflow"
          fi
          git push origin HEAD:agent/v1-stabilization-integration
