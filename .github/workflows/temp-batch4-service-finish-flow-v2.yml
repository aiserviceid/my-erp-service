name: Batch 4 Service Finish Flow V2

on:
  push:
    branches:
      - agent/v1-stabilization-integration
    paths:
      - .github/batch4-service-finish-flow-v2-trigger.txt

jobs:
  patch_build_clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch files
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          function replaceRequired(file, from, to, label) {
            let text = fs.readFileSync(file, 'utf8');
            if (!text.includes(from)) throw new Error(`${label} not found in ${file}`);
            text = text.replace(from, to);
            fs.writeFileSync(file, text);
          }

          const admin = 'src/pages/AdminDashboard.jsx';
          replaceRequired(admin,
            `<h3 style={{ margin: 0 }}>Edit Nota Servis</h3>`,
            `<h3 style={{ margin: 0 }}>{selectedService.__markSelesaiFromAdmin ? 'Selesaikan Servis & Tagihan' : 'Edit Nota Servis'}</h3>`,
            'admin modal title'
          );
          replaceRequired(admin,
            `<p style={{ fontSize: '0.85rem', color: '#64748b', marginBottom: '14px' }}>Resi: <strong>{selectedService.resi}</strong></p>`,
            `<p style={{ fontSize: '0.85rem', color: '#64748b', marginBottom: '10px' }}>Resi: <strong>{selectedService.resi}</strong></p>\n            {selectedService.__markSelesaiFromAdmin && (\n              <div style={{ marginBottom: '14px', padding: '12px', borderRadius: '14px', background: '#ecfdf5', border: '1px solid #bbf7d0', color: '#065f46', fontSize: '0.82rem', fontWeight: 800, lineHeight: 1.5 }}>\n                Isi rincian perbaikan dan biaya final. Sparepart opsional; jasa bisa diisi tanpa sparepart. Setelah disimpan, status menjadi <strong>SELESAI</strong> dan pelanggan bisa langsung dihubungi via WhatsApp.\n              </div>\n            )}`,
            'admin helper note'
          );
          replaceRequired(admin,
            `      const nextService = { ...selectedService, ...updatedService, ...(selectedService.__markSelesaiFromAdmin ? { status: 'SELESAI' } : {}), part_fee: partFee, jasa_fee: jasaFee, issue: updatedIssue };\n      setSelectedService(nextService);\n      setServices(services.map(s => s.resi === selectedService.resi ? { ...s, ...nextService } : s));\n      setShowEditServiceNota(false);\n      alert(selectedService.__markSelesaiFromAdmin ? 'Rincian tagihan berhasil disimpan dan status menjadi Selesai.' : 'Nota servis berhasil dikoreksi.');`,
            `      const nextService = { ...selectedService, ...updatedService, ...(selectedService.__markSelesaiFromAdmin ? { status: 'SELESAI' } : {}), part_fee: partFee, jasa_fee: jasaFee, issue: updatedIssue };\n      setSelectedService(nextService);\n      setServices(services.map(s => s.resi === selectedService.resi ? { ...s, ...nextService } : s));\n      setShowEditServiceNota(false);\n      if (selectedService.__markSelesaiFromAdmin) {\n        const totalTagihan = Math.max(0, partFee + jasaFee - discount);\n        const trackingUrl = window.location.origin + '/tracking?resi=' + selectedService.resi;\n        const message = 'Halo Kak ' + selectedService.customer_name + ', servis ' + selectedService.device_name + ' dengan Resi ' + selectedService.resi + ' sudah *SELESAI*.\\n\\nRincian biaya:\\n- Sparepart: Rp ' + partFee.toLocaleString('id-ID') + '\\n- Jasa: Rp ' + jasaFee.toLocaleString('id-ID') + '\\n- Diskon: Rp ' + discount.toLocaleString('id-ID') + '\\nTotal: *Rp ' + totalTagihan.toLocaleString('id-ID') + '*\\n\\nCek status di sini:\\n' + trackingUrl + '\\n\\nTerima kasih.';\n        const shouldSendWA = selectedService.customer_phone && await (window.UnitProConfirm ? window.UnitProConfirm({ title: 'Kirim WA pelanggan?', message: 'Status servis sudah menjadi SELESAI. Kirim info tagihan dan link tracking ke pelanggan sekarang?', confirmText: 'Kirim WA', tone: 'success' }) : Promise.resolve(window.confirm('Kirim info selesai servis ke WhatsApp pelanggan?')));\n        if (shouldSendWA) {\n          await sendWhatsAppNotification({ tenant, target: selectedService.customer_phone, message });\n        }\n        alert('Rincian tagihan berhasil disimpan dan status menjadi Selesai.');\n      } else {\n        alert('Nota servis berhasil dikoreksi.');\n      }`,
            'admin save block'
          );

          const emp = 'src/pages/EmployeePortal.jsx';
          replaceRequired(emp,
            `<h3 style={{ margin: 0 }}>Rincian Biaya Servis</h3>`,
            `<h3 style={{ margin: 0 }}>Selesaikan Servis & Tagihan</h3>`,
            'employee modal title'
          );
          replaceRequired(emp,
            `<p style={{ fontSize: '0.9rem', marginBottom: '15px' }}>Resi: {selectedService.resi}</p>`,
            `<p style={{ fontSize: '0.9rem', marginBottom: '10px' }}>Resi: <strong>{selectedService.resi}</strong></p>\n              <div style={{ marginBottom: '15px', padding: '12px', borderRadius: '14px', background: '#ecfdf5', border: '1px solid #bbf7d0', color: '#065f46', fontSize: '0.82rem', fontWeight: 800, lineHeight: 1.5 }}>\n                Isi rincian pekerjaan final. Sparepart opsional; jasa bisa diisi tanpa sparepart. Setelah disimpan, status menjadi <strong>SELESAI</strong> dan WhatsApp pelanggan diproses.\n              </div>`,
            'employee helper note'
          );
          replaceRequired(emp,
            `await apiService.post('/services/finish', {\n                  resi: selectedService.resi,\n                  status: 'SELESAI',`,
            `await apiService.post('/services/finish', {\n                  resi: selectedService.resi,\n                  tenant_code: selectedService.tenant_code || tenant?.code || employee?.tenant_code,\n                  status: 'SELESAI',`,
            'employee tenant code'
          );
          replaceRequired(emp,
            `alert('Berhasil disimpan & Notifikasi WA diproses!');`,
            `alert('Servis selesai. Rincian tagihan tersimpan dan WhatsApp pelanggan diproses.');`,
            'employee success message'
          );
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit and clean
        if: always()
        shell: bash
        run: |
          git config user.name aiserviceid
          git config user.email ai.interiorid@gmail.com
          git add src/pages/AdminDashboard.jsx src/pages/EmployeePortal.jsx
          git commit -m "feat: polish service completion flow" || echo "nothing to commit"
          git rm .github/workflows/temp-batch4-service-finish-flow-v2.yml .github/batch4-service-finish-flow-v2-trigger.txt || true
          git commit -m "chore: clean batch 4 temp workflow" || echo "nothing to clean"
          git push || true
