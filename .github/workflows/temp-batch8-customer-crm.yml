name: Batch 8 Customer CRM

on:
  push:
    paths:
      - '.github/trigger-batch8-customer-crm.txt'
      - '.github/workflows/temp-batch8-customer-crm.yml'

permissions:
  contents: write

jobs:
  patch_build_clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1-stabilization-integration
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch customer CRM
        run: |
          cat > src/components/CustomerCRMInsights.jsx <<'EOF'
          import React, { useMemo } from 'react';
          import { Users, MessageCircle, Clock, CheckCircle, ShoppingCart, Crown } from 'lucide-react';
          
          const normalizePhone = (value = '') => String(value || '').replace(/[^0-9+]/g, '').replace(/^0/, '62');
          
          const parsePosCustomer = (tx = {}) => {
            const desc = tx.description || '';
            const custMatch = desc.match(/\| Cust: ([^|]+)/);
            const waMatch = desc.match(/\| WA: ([^|]+)/);
            if (!custMatch && !waMatch) return null;
            return {
              name: custMatch ? custMatch[1].trim() : 'Pelanggan POS',
              phone: waMatch ? waMatch[1].trim() : '',
              source: 'POS',
              status: 'SELESAI',
              device: 'Pembelian Kasir',
              created_at: tx.created_at,
              amount: Number(tx.amount || 0),
            };
          };
          
          export default function CustomerCRMInsights({ services = [], transactions = [], tenant, settings = {} }) {
            const crm = useMemo(() => {
              const map = new Map();
              const touch = (entry) => {
                const phone = normalizePhone(entry.phone || entry.customer_phone);
                const key = phone || String(entry.name || entry.customer_name || 'Tanpa Nama').trim().toLowerCase();
                if (!key) return;
                const prev = map.get(key) || {
                  name: entry.name || entry.customer_name || 'Pelanggan',
                  phone,
                  lastAt: entry.created_at || new Date().toISOString(),
                  serviceCount: 0,
                  posCount: 0,
                  totalSpent: 0,
                  readyPickup: 0,
                  devices: new Set(),
                  statuses: new Set(),
                };
                const currentDate = new Date(entry.created_at || Date.now()).getTime();
                const prevDate = new Date(prev.lastAt || 0).getTime();
                if (currentDate >= prevDate) prev.lastAt = entry.created_at || prev.lastAt;
                if (entry.source === 'POS') prev.posCount += 1;
                else prev.serviceCount += 1;
                if (entry.amount) prev.totalSpent += Number(entry.amount || 0);
                const status = String(entry.status || '').toUpperCase();
                if (status) prev.statuses.add(status);
                if (status === 'SELESAI') prev.readyPickup += 1;
                const device = entry.device || entry.device_name;
                if (device) prev.devices.add(device);
                if (phone && !prev.phone) prev.phone = phone;
                map.set(key, prev);
              };
          
              services.forEach((service) => touch({ ...service, source: 'SERVIS' }));
              transactions.filter((tx) => tx.type === 'POS_SALES').map(parsePosCustomer).filter(Boolean).forEach(touch);
          
              const customers = Array.from(map.values()).map((item) => ({ ...item, devices: Array.from(item.devices), statuses: Array.from(item.statuses) }));
              const now = Date.now();
              const day = 24 * 60 * 60 * 1000;
              return {
                customers,
                total: customers.length,
                withPhone: customers.filter((c) => c.phone).length,
                active30: customers.filter((c) => now - new Date(c.lastAt || now).getTime() <= 30 * day).length,
                dormant60: customers.filter((c) => c.phone && now - new Date(c.lastAt || now).getTime() > 60 * day).length,
                repeat: customers.filter((c) => (c.serviceCount + c.posCount) > 1).length,
                readyPickup: customers.filter((c) => c.readyPickup > 0).length,
                posBuyer: customers.filter((c) => c.posCount > 0).length,
              };
            }, [services, transactions]);
          
            const storeName = settings.storeName || tenant?.name || 'Toko Servis';
            const segments = [
              { key: 'ready', icon: CheckCircle, label: 'Siap Diambil', count: crm.readyPickup, hint: 'Follow-up barang selesai agar cepat diambil.' },
              { key: 'active', icon: MessageCircle, label: 'Aktif 30 Hari', count: crm.active30, hint: 'Pelanggan hangat untuk update layanan.' },
              { key: 'dormant', icon: Clock, label: 'Lama Tidak Datang', count: crm.dormant60, hint: 'Cocok untuk promo servis berkala.' },
              { key: 'pos', icon: ShoppingCart, label: 'Pembeli POS', count: crm.posBuyer, hint: 'Target promo aksesoris dan sparepart.' },
            ];
          
            const copySegmentPhones = async (key) => {
              const now = Date.now();
              const day = 24 * 60 * 60 * 1000;
              const selected = crm.customers.filter((c) => {
                const last = new Date(c.lastAt || now).getTime();
                if (!c.phone) return false;
                if (key === 'ready') return c.readyPickup > 0;
                if (key === 'active') return now - last <= 30 * day;
                if (key === 'dormant') return now - last > 60 * day;
                if (key === 'pos') return c.posCount > 0;
                return false;
              });
              const phones = selected.map((c) => c.phone).filter(Boolean).join(', ');
              if (!phones) return alert('Belum ada nomor WA di segment ini.');
              await navigator.clipboard.writeText(phones);
              alert(`Nomor segment berhasil disalin (${selected.length} pelanggan).`);
            };
          
            return (
              <div className="customer-crm-insights">
                <div className="customer-crm-hero">
                  <div>
                    <p>CRM PELANGGAN</p>
                    <h3>Pelanggan yang bisa difollow-up hari ini</h3>
                    <span>Data otomatis dari servis dan kasir. Gunakan ini untuk menjaga pelanggan lama tetap kembali ke {storeName}.</span>
                  </div>
                  <div className="customer-crm-pro-badge"><Crown size={15} /> WhatsApp Marketing Pro</div>
                </div>
          
                <div className="customer-crm-metrics">
                  <div><span>Total Pelanggan</span><strong>{crm.total}</strong><small>Servis + POS</small></div>
                  <div><span>Nomor WA</span><strong>{crm.withPhone}</strong><small>Siap dihubungi</small></div>
                  <div><span>Repeat</span><strong>{crm.repeat}</strong><small>Lebih dari 1 transaksi</small></div>
                  <div><span>Perlu Follow-up</span><strong>{crm.readyPickup + crm.dormant60}</strong><small>Siap diambil / lama tidak datang</small></div>
                </div>
          
                <div className="customer-segment-grid">
                  {segments.map((segment) => {
                    const Icon = segment.icon;
                    return (
                      <button key={segment.key} type="button" className="customer-segment-card" onClick={() => copySegmentPhones(segment.key)}>
                        <span><Icon size={18} /></span>
                        <strong>{segment.label}</strong>
                        <b>{segment.count} pelanggan</b>
                        <small>{segment.hint}</small>
                      </button>
                    );
                  })}
                </div>
              </div>
            );
          }
          EOF
          node <<'EOF'
          const fs = require('fs');
          const path = 'src/pages/AdminDashboard.jsx';
          let text = fs.readFileSync(path, 'utf8');
          if (!text.includes("CustomerCRMInsights")) {
            text = text.replace("import PremiumDashboardSummary from '../components/PremiumDashboardSummary';", "import PremiumDashboardSummary from '../components/PremiumDashboardSummary';\nimport CustomerCRMInsights from '../components/CustomerCRMInsights';");
          }
          text = text.replace('👥 Database Pelanggan & WhatsApp Blast CRM', '👥 Pelanggan & WhatsApp Marketing');
          text = text.replace('Kelola database seluruh pelanggan toko dan kirim pesan promosi / pengingat via WhatsApp massal.', 'Pantau pelanggan, segmentasi follow-up, dan siapkan WhatsApp Marketing sebagai fitur Pro.');
          const marker = '            {/* CRM Metrics Cards */}';
          if (!text.includes('<CustomerCRMInsights services={services}')) {
            text = text.replace(marker, '            <CustomerCRMInsights services={services} transactions={transactions} tenant={tenant} settings={settings} />\n\n' + marker);
          }
          text = text.replace(/WA BLAST CAMPAIGN GENERATOR BOX/g, 'WHATSAPP MARKETING COMPOSER');
          text = text.replace(/Atur pesan WA Blast promo atau pengingat/g, 'Atur WhatsApp Marketing promo atau pengingat');
          text = text.replace(/Kirim Broadcast WA Blast Promo \/ Reminder/g, 'WhatsApp Marketing Promo / Reminder');
          text = text.replace(/Kirim WA Blast 📲/g, 'Kirim WA 📲');
          text = text.replace(/Broadcast WA/g, 'WhatsApp Marketing');
          text = text.replace(/WA Blast/g, 'WhatsApp Marketing');
          fs.writeFileSync(path, text);
          EOF
          cat >> src/index.css <<'EOF'
          
          /* Batch 8: Customer CRM premium dashboard */
          .customer-crm-insights { margin-bottom: 22px; display: grid; gap: 14px; }
          .customer-crm-hero { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; padding: 20px; border-radius: 20px; background: linear-gradient(135deg, #071c2b, #0f766e); color: #fff; box-shadow: 0 12px 28px rgba(15, 118, 110, .18); }
          .customer-crm-hero p { margin: 0 0 6px; color: #99f6e4; font-size: 10px; font-weight: 900; letter-spacing: .12em; }
          .customer-crm-hero h3 { margin: 0; color: #fff; font-size: 22px; font-weight: 900; letter-spacing: -.03em; }
          .customer-crm-hero span { display: block; max-width: 720px; margin-top: 6px; color: #d1fae5; font-size: 13px; line-height: 1.5; }
          .customer-crm-pro-badge { display: inline-flex; align-items: center; gap: 7px; flex: 0 0 auto; padding: 9px 12px; border-radius: 999px; background: rgba(255,255,255,.13); color: #fde68a; font-size: 12px; font-weight: 900; border: 1px solid rgba(255,255,255,.18); }
          .customer-crm-metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
          .customer-crm-metrics > div { padding: 16px; border-radius: 16px; border: 1px solid #e2e8f0; background: #fff; }
          .customer-crm-metrics span, .customer-crm-metrics small { display: block; color: #64748b; font-size: 11px; font-weight: 800; }
          .customer-crm-metrics strong { display: block; margin: 4px 0; color: #0f172a; font-size: 26px; font-weight: 950; }
          .customer-segment-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
          .customer-segment-card { display: grid; gap: 5px; min-height: 128px; padding: 15px; border: 1px solid #dbe8ed; border-radius: 16px; background: #f8fbfc; text-align: left; cursor: pointer; transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease; }
          .customer-segment-card:hover { transform: translateY(-2px); border-color: #5eead4; box-shadow: 0 10px 24px rgba(15, 118, 110, .09); }
          .customer-segment-card span { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 11px; background: #ccfbf1; color: #0f766e; }
          .customer-segment-card strong { color: #0f172a; font-size: 14px; font-weight: 900; }
          .customer-segment-card b { color: #0f766e; font-size: 12px; }
          .customer-segment-card small { color: #64748b; font-size: 11px; line-height: 1.35; }
          @media (max-width: 768px) { .customer-crm-hero { flex-direction: column; padding: 18px; } .customer-crm-hero h3 { font-size: 19px; } .customer-crm-pro-badge { width: 100%; justify-content: center; } .customer-crm-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); } .customer-segment-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .customer-segment-card { min-height: 118px; padding: 13px; } }
          html.native-app .customer-crm-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
          html.native-app .customer-segment-grid { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
          EOF
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit source and clean
        run: |
          git config user.name "aiserviceid"
          git config user.email "ai.interiorid@gmail.com"
          rm -f .github/workflows/temp-batch8-customer-crm.yml .github/trigger-batch8-customer-crm.txt
          git add src/components/CustomerCRMInsights.jsx src/pages/AdminDashboard.jsx src/index.css .github/workflows/temp-batch8-customer-crm.yml .github/trigger-batch8-customer-crm.txt
          git commit -m "feat: polish customer CRM dashboard" || true
          git push
