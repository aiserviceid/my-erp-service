name: finance_dedupe_v2

on:
  push:
    branches:
      - agent/v1-stabilization-integration
    paths:
      - '.github/workflows/temp-finance-dedupe-v2.yml'
      - '.github/finance-dedupe-v2-trigger.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1-stabilization-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch finance report
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/pages/AdminDashboard.jsx')
          s = p.read_text()
          a = s.find("activeTab === 'keuangan' ? (")
          b = s.find(") : activeTab === 'karyawan' ? (", a)
          if a < 0 or b < 0:
              raise SystemExit('finance branch not found')
          new = '''activeTab === 'keuangan' ? (
          <div className="glass-panel finance-report" style={{ minHeight: '400px', animation: 'fadeIn 0.3s ease-in-out' }}>
            <PremiumFinanceReport transactions={transactions} services={services} products={products} users={users} tenant={tenant} />
            <SecurityReadinessPanel tenant={tenant} users={users} products={products} services={services} transactions={transactions} />
          </div>
        '''
          p.write_text(s[:a] + new + s[b:])
          PY
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit and cleanup
        run: |
          git config user.name "aiserviceid"
          git config user.email "ai.interiorid@gmail.com"
          git add src/pages/AdminDashboard.jsx
          git rm --ignore-unmatch .github/workflows/temp-finance-dedupe-v2.yml .github/finance-dedupe-v2-trigger.txt
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: show only premium finance report"
          git pull --rebase origin agent/v1-stabilization-integration
          git push origin HEAD:agent/v1-stabilization-integration
