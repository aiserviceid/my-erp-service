name: Batch 10-12 Finalize

on:
  push:
    branches:
      - agent/v1-stabilization-integration
    paths:
      - '.github/workflows/temp-batch10-12-finalize.yml'
      - '.github/batch10-12-finalize-trigger.txt'

permissions:
  contents: write

jobs:
  patch_build_clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1-stabilization-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch AdminDashboard and mobile CSS
        run: |
          python3 <<'PY'
          from pathlib import Path
          admin_path = Path('src/pages/AdminDashboard.jsx')
          text = admin_path.read_text()

          import_anchor = "import CustomerCRMInsights from '../components/CustomerCRMInsights';"
          import_block = import_anchor + "\nimport PremiumFinanceReport from '../components/PremiumFinanceReport';\nimport OnboardingProgressCard from '../components/OnboardingProgressCard';\nimport SecurityReadinessPanel from '../components/SecurityReadinessPanel';"
          if "../components/PremiumFinanceReport" not in text:
              text = text.replace(import_anchor, import_block)

          onboarding_tag = "<OnboardingProgressCard tenant={tenant} users={users} products={products} services={services} setActiveTab={setActiveTab} />"
          if onboarding_tag not in text:
              start = text.find("            {/* INTERACTIVE EMPTY STATE PROGRESS BAR (If no data) */}")
              end = text.find("            {/* METRICS CARDS: HARI INI */}", start)
              if start != -1 and end != -1:
                  text = text[:start] + "            " + onboarding_tag + "\n\n" + text[end:]
              else:
                  raise SystemExit('Could not find onboarding block to replace')

          finance_tag = "<PremiumFinanceReport transactions={transactions} services={services} products={products} users={users} tenant={tenant} />"
          if finance_tag not in text:
              markers = ["activeTab === 'keuangan' ? (", 'activeTab === "keuangan" ? (']
              idx = -1
              for marker in markers:
                  idx = text.find(marker)
                  if idx != -1:
                      break
              if idx == -1:
                  raise SystemExit('Could not find keuangan tab marker')
              div_idx = text.find('<div', idx)
              if div_idx == -1:
                  raise SystemExit('Could not find finance container div')
              gt_idx = text.find('>', div_idx)
              if gt_idx == -1:
                  raise SystemExit('Could not find finance container close bracket')
              inject = "\n            " + finance_tag + "\n            <SecurityReadinessPanel tenant={tenant} users={users} products={products} services={services} transactions={transactions} />"
              text = text[:gt_idx + 1] + inject + text[gt_idx + 1:]

          admin_path.write_text(text)

          css_path = Path('src/index.css')
          css = css_path.read_text()
          css_block = '''

/* Batch 10-12 owner report, onboarding, and readiness polish */
@media (max-width: 860px) {
  .premium-finance-grid {
    grid-template-columns: 1fr !important;
  }
}

@media (max-width: 640px) {
  .premium-finance-report section,
  .premium-finance-report div {
    max-width: 100%;
  }
}
'''
          if 'Batch 10-12 owner report' not in css:
              css_path.write_text(css.rstrip() + css_block + '\n')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit and cleanup
        run: |
          git config user.name "aiserviceid"
          git config user.email "ai.interiorid@gmail.com"
          git add src/pages/AdminDashboard.jsx src/index.css
          git rm -f .github/workflows/temp-batch10-12-finalize.yml .github/batch10-12-finalize-trigger.txt --ignore-unmatch || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: finalize batch 10 11 12 dashboard integration"
          git pull --rebase origin agent/v1-stabilization-integration
          git push origin HEAD:agent/v1-stabilization-integration
