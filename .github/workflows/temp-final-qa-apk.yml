name: final_qa_apk

on:
  push:
    branches:
      - agent/v1-stabilization-integration
    paths:
      - '.github/workflows/temp-final-qa-apk.yml'
      - '.github/final-qa-apk-trigger.txt'

permissions:
  contents: write
  actions: read

jobs:
  qa_and_apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1-stabilization-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm ci
      - name: Web build
        run: npm run build
      - name: V1 smoke check
        run: npm run smoke:v1
      - name: Sync Android
        run: npm run sync:android
      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: unitpro-debug-apk-final-qa
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Commit cleanup
        if: always()
        run: |
          git config user.name "aiserviceid"
          git config user.email "ai.interiorid@gmail.com"
          git rm --ignore-unmatch .github/workflows/temp-final-qa-apk.yml .github/final-qa-apk-trigger.txt
          if git diff --cached --quiet; then
            echo "No cleanup changes"
            exit 0
          fi
          git commit -m "chore: cleanup final qa apk workflow"
          git pull --rebase origin agent/v1-stabilization-integration
          git push origin HEAD:agent/v1-stabilization-integration
