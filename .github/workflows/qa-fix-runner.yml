name: Temporary QA Runner

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  patch-qa-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4
        with:
          ref: agent/qa-fix-main-findings

      - name: Patch QA findings
        run: |
          cat > /tmp/qa_patch.py <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Pattern not found: {label} in {path}')
              p.write_text(text.replace(old, new, 1))

          def regex_replace_once(path, pattern, repl, label, flags=0):
              p = Path(path)
              text = p.read_text()
              new_text, count = re.subn(pattern, repl, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'Regex pattern not found: {label} in {path}')
              p.write_text(new_text)

          replace_once('src/components/POSView.jsx', """  const isServiceItem = (product) => {\n    const category = getProductCategory(product);\n    const name = String(product?.name || '').toLowerCase();\n    const serviceKeywords = /(jasa|servis|service|layanan|install|instal|reball|reballing|flash|flashing|cleaning|thermal|software|setting|backup|upgrade|cek|diagnosa)/i;\n    return category === 'JASA' || category === 'SERVIS' || category === 'SERVICE' || category === 'LAYANAN' || category.includes('JASA') || category.includes('SERVIS') || category.includes('SERVICE') || category.includes('LAYANAN') || serviceKeywords.test(name) || (Number(product?.stock || 0) >= 900 && serviceKeywords.test(name));\n  };\n""", """  const isServiceItem = (product) => {\n    const category = getProductCategory(product);\n    const name = String(product?.name || '').toLowerCase();\n    const serviceKeywords = /(jasa|servis|service|layanan|install|instal|reball|reballing|flash|flashing|cleaning|thermal|software|setting|backup|upgrade|cek|diagnosa)/i;\n    const serviceCategories = ['JASA', 'SERVIS', 'SERVICE', 'LAYANAN'];\n    const physicalCategories = ['SPAREPART', 'SPARE_PART', 'AKSESORIS', 'BARANG', 'PRODUK', 'PRODUCT'];\n\n    if (serviceCategories.some((item) => category === item || category.includes(item))) return true;\n    if (physicalCategories.some((item) => category === item || category.includes(item))) return false;\n\n    return serviceKeywords.test(name) || (Number(product?.stock || 0) >= 900 && serviceKeywords.test(name));\n  };\n""", 'POS category source of truth')

          admin_path = 'src/pages/AdminDashboard.jsx'
          replace_once(admin_path, """  const openAppUpdate = async () => {\n    if (Capacitor.isNativePlatform()) {\n      await Browser.open({ url: latestApkUrl });\n      return;\n    }\n    window.open(latestApkUrl, '_blank', 'noopener,noreferrer');\n  };\n\n  const handleImageUpload = async (file, callback) => {\n""", """  const openAppUpdate = async () => {\n    if (Capacitor.isNativePlatform()) {\n      await Browser.open({ url: latestApkUrl });\n      return;\n    }\n    window.open(latestApkUrl, '_blank', 'noopener,noreferrer');\n  };\n\n  const normalizePhoneForCompare = (value = '') => {\n    const digits = String(value || '').replace(/\\D/g, '');\n    if (!digits) return '';\n    if (digits.startsWith('62')) return digits;\n    if (digits.startsWith('0')) return '62' + digits.slice(1);\n    if (digits.startsWith('8')) return '62' + digits;\n    return digits;\n  };\n\n  const getEmployeeByPhone = (phone = '') => {\n    const normalizedTarget = normalizePhoneForCompare(phone);\n    if (!normalizedTarget) return null;\n    return users.find((user) => normalizePhoneForCompare(user.phone) === normalizedTarget) || null;\n  };\n\n  const confirmCustomerPhoneIsSafe = async (phone = '', customerName = 'pelanggan') => {\n    const employee = getEmployeeByPhone(phone);\n    if (!employee) return true;\n    const message = `Nomor WhatsApp ${phone} untuk ${customerName} sama dengan nomor karyawan ${employee.name} (${employee.role}).\\n\\nPeriksa lagi agar tagihan dan notifikasi tidak terkirim ke karyawan.`;\n    if (window.UnitProConfirm) {\n      return await window.UnitProConfirm({ title: 'Nomor WA bentrok dengan karyawan', message, confirmText: 'Tetap lanjut', cancelText: 'Perbaiki dulu', tone: 'warning' });\n    }\n    return window.confirm(message + '\\n\\nTetap lanjut?');\n  };\n\n  const handleImageUpload = async (file, callback) => {\n""", 'Admin phone helper')
          replace_once(admin_path, """    if (!/^(?:\\+?62|0)8\\d{7,12}$/.test(phone)) {\n      alert('Masukkan nomor WhatsApp yang valid, contoh: 081234567890.');\n      return;\n    }\n\n    const kelengkapan = fd.get('kelengkapan') || '-';\n""", """    if (!/^(?:\\+?62|0)8\\d{7,12}$/.test(phone)) {\n      alert('Masukkan nomor WhatsApp yang valid, contoh: 081234567890.');\n      return;\n    }\n    if (!await confirmCustomerPhoneIsSafe(phone, fd.get('name') || 'pelanggan')) return;\n\n    const kelengkapan = fd.get('kelengkapan') || '-';\n""", 'Admin service WA validation')
          replace_once(admin_path, """        const storeName = tenant?.settings?.storeName || tenant?.name || 'Toko Servis';\n        const trackingUrl = `${window.location.origin}/tracking?resi=${service.resi}`;\n        const message = `Halo Kak ${service.customer_name}, status servis ${service.device_name} (Resi: ${service.resi}) dari *${storeName}* sekarang: *${getStatusInfo(newStatus).label}*.\\n\\nCek status langsung di sini:\\n${trackingUrl}`;\n        await sendWhatsAppNotification({ tenant, target: service.customer_phone, message, openManual: true });\n""", """        if (!await confirmCustomerPhoneIsSafe(service.customer_phone, service.customer_name || 'pelanggan')) return;\n        const storeName = tenant?.settings?.storeName || tenant?.name || 'Toko Servis';\n        const trackingUrl = `${window.location.origin}/tracking?resi=${service.resi}`;\n        const message = `Halo Kak ${service.customer_name}, status servis ${service.device_name} (Resi: ${service.resi}) dari *${storeName}* sekarang: *${getStatusInfo(newStatus).label}*.\\n\\nCek status langsung di sini:\\n${trackingUrl}`;\n        await sendWhatsAppNotification({ tenant, target: service.customer_phone, message, openManual: true });\n""", 'Admin status WA validation')
          regex_replace_once(admin_path, r"(<PremiumFinanceReport[\s\S]*?)(\n\s*/>)", lambda m: m.group(1) + ('' if 'users={users}' in m.group(1) else '\n              users={users}') + m.group(2), 'users prop', flags=re.M)

          finance_path = 'src/components/PremiumFinanceReport.jsx'
          replace_once(finance_path, """  products = [],\n  tenant,\n  settings,\n  onRefreshData\n}) {\n""", """  products = [],\n  users = [],\n  tenant,\n  settings,\n  onRefreshData\n}) {\n""", 'Finance users prop')
          replace_once(finance_path, """const EXPENSE_CATEGORIES = [\n  'Beli sparepart',\n  'Gaji/kasbon',\n  'Sewa toko',\n  'Listrik/internet',\n  'Transport',\n  'Operasional',\n  'Lain-lain'\n];\n\nexport default function PremiumFinanceReport({\n""", """const EXPENSE_CATEGORIES = [\n  'Beli sparepart',\n  'Gaji/kasbon',\n  'Sewa toko',\n  'Listrik/internet',\n  'Transport',\n  'Operasional',\n  'Lain-lain'\n];\n\nconst normalizePhoneForCompare = (value = '') => {\n  const digits = String(value || '').replace(/\\D/g, '');\n  if (!digits) return '';\n  if (digits.startsWith('62')) return digits;\n  if (digits.startsWith('0')) return '62' + digits.slice(1);\n  if (digits.startsWith('8')) return '62' + digits;\n  return digits;\n};\n\nconst getEmployeePhoneConflict = (phone = '', users = []) => {\n  const normalizedTarget = normalizePhoneForCompare(phone);\n  if (!normalizedTarget) return null;\n  return users.find((user) => normalizePhoneForCompare(user.phone) === normalizedTarget) || null;\n};\n\nexport default function PremiumFinanceReport({\n""", 'Finance helper')
          replace_once(finance_path, """                  const billTotal = part + jasa > 0 ? (part + jasa - disc) : est;\n\n                  return (\n""", """                  const billTotal = part + jasa > 0 ? (part + jasa - disc) : est;\n                  const phoneConflict = getEmployeePhoneConflict(s.customer_phone, users);\n\n                  return (\n""", 'Finance row conflict')
          replace_once(finance_path, """                        <small style={{ color: '#64748b' }}>{s.customer_phone || 'Tanpa No. WA'}</small>\n""", """                        <small style={{ color: '#64748b' }}>{s.customer_phone || 'Tanpa No. WA'}</small>\n                        {phoneConflict && (\n                          <small style={{ display: 'block', color: '#dc2626', fontWeight: '800', marginTop: '3px' }}>\n                            ⚠ Sama dengan WA karyawan: {phoneConflict.name}\n                          </small>\n                        )}\n""", 'Finance warning')
          replace_once(finance_path, """                              onClick={() => {\n                                const cleanPhone = s.customer_phone.replace(/^0/, '62');\n                                const msg = `Halo Kak ${s.customer_name}, unit ${s.device_name} di ${tenant?.settings?.storeName || tenant?.name || 'Toko Servis'} (Resi: ${s.resi}) berstatus ${s.status}. Total tagihan: Rp ${formatRupiah(billTotal)}. Terima kasih!`;\n                                window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}`, '_blank');\n                              }}\n""", """                              onClick={() => {\n                                if (phoneConflict) {\n                                  alert(`Nomor WA pelanggan ini sama dengan nomor karyawan ${phoneConflict.name}. Perbaiki nomor pelanggan dulu agar tagihan tidak salah alamat.`);\n                                  return;\n                                }\n                                const cleanPhone = normalizePhoneForCompare(s.customer_phone);\n                                const msg = `Halo Kak ${s.customer_name}, unit ${s.device_name} di ${tenant?.settings?.storeName || tenant?.name || 'Toko Servis'} (Resi: ${s.resi}) berstatus ${s.status}. Total tagihan: Rp ${formatRupiah(billTotal)}. Terima kasih!`;\n                                window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}`, '_blank');\n                              }}\n""", 'Finance block WA')

          replace_once('src/components/OnboardingProgressCard.jsx', """    const jasaCount = products.filter((product) => String(product.category || '').toUpperCase() === 'JASA').length;\n    const physicalCount = products.filter((product) => String(product.category || '').toUpperCase() !== 'JASA').length;\n    const steps = [\n      { key: 'store', title: 'Setup Toko', desc: 'Nama toko dan nomor WhatsApp aktif.', done: !isDefaultStoreName(storeName) && Boolean(storeWa), tab: 'pengaturan', icon: Store },\n      { key: 'team', title: 'Tambah Teknisi', desc: 'Minimal 1 teknisi untuk menerima tugas.', done: technicianCount > 0, tab: 'karyawan', icon: Users },\n      { key: 'catalog', title: 'Barang & Jasa', desc: 'Isi sparepart dan katalog jasa servis.', done: physicalCount > 0 && jasaCount > 0, tab: 'master', icon: Package },\n""", """    const serviceCategories = ['JASA', 'SERVIS', 'SERVICE', 'LAYANAN'];\n    const jasaCount = products.filter((product) => serviceCategories.includes(String(product.category || '').toUpperCase())).length;\n    const physicalCount = products.filter((product) => !serviceCategories.includes(String(product.category || '').toUpperCase())).length;\n    const catalogReady = products.length > 0;\n    const steps = [\n      { key: 'store', title: 'Setup Toko', desc: 'Nama toko dan nomor WhatsApp aktif.', done: !isDefaultStoreName(storeName) && Boolean(storeWa), tab: 'pengaturan', icon: Store },\n      { key: 'team', title: 'Tambah Teknisi', desc: 'Minimal 1 teknisi untuk menerima tugas.', done: technicianCount > 0, tab: 'karyawan', icon: Users },\n      { key: 'catalog', title: 'Barang & Jasa', desc: catalogReady ? `${physicalCount} barang/sparepart, ${jasaCount} jasa/layanan.` : 'Isi minimal 1 barang, sparepart, atau jasa servis.', done: catalogReady, tab: 'master', icon: Package },\n""", 'Onboarding catalog')

          css_path = Path('src/index.css')
          css = css_path.read_text()
          addition = """

/* QA Fix 2026-08-08: jaga sidebar desktop tetap muncul setelah pindah sub-tab Tim/Kasbon/Absensi */
@media (min-width: 769px) {
  body:not(.native-app) .dashboard-layout > .sidebar {
    display: flex !important;
    flex-direction: column !important;
    visibility: visible !important;
    opacity: 1 !important;
  }

  body:not(.native-app) .dashboard-layout > .sidebar .nav-item {
    display: flex !important;
    visibility: visible !important;
    opacity: 1 !important;
  }
}
"""
          if 'QA Fix 2026-08-08: jaga sidebar desktop' not in css:
              css_path.write_text(css.rstrip() + addition)

          app_path = 'src/App.jsx'
          replace_once(app_path, """const PrivacyPage = lazy(() => import('./pages/PrivacyPage'));\nconst isNativeApp = Capacitor.isNativePlatform();\n""", """const PrivacyPage = lazy(() => import('./pages/PrivacyPage'));\nconst TrackRedirectRoute = () => {\n  const resi = window.location.pathname.split('/track/')[1] || '';\n  return <Navigate to={`/tracking?resi=${encodeURIComponent(decodeURIComponent(resi))}`} replace />;\n};\nconst isNativeApp = Capacitor.isNativePlatform();\n""", 'App route helper')
          replace_once(app_path, """            <Route path=\"/tracking\" element={<PublicTracking />} />\n            <Route path=\"/katalog/:tenantCode\" element={<PublicCatalog />} />\n""", """            <Route path=\"/tracking\" element={<PublicTracking />} />\n            <Route path=\"/track/:resi\" element={<TrackRedirectRoute />} />\n            <Route path=\"/katalog/:tenantCode\" element={<PublicCatalog />} />\n""", 'App track route')

          print('QA patch applied successfully')
          PY
          python3 /tmp/qa_patch.py

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit patched QA branch
        run: |
          git config user.name "qa-fix-bot"
          git config user.email "qa-fix-bot@unitpro.local"
          rm -f .github/workflows/qa-fix-temp.yml
          git add src/components/POSView.jsx src/pages/AdminDashboard.jsx src/components/PremiumFinanceReport.jsx src/components/OnboardingProgressCard.jsx src/index.css src/App.jsx .github/workflows/qa-fix-temp.yml
          git status --short
          git commit -m "fix: address QA report priority findings"
          git push origin HEAD:agent/qa-fix-main-findings

      - name: Remove temporary runner from main
        run: |
          git fetch origin main
          git checkout main
          git pull origin main
          git rm -f .github/workflows/qa-fix-runner.yml
          git commit -m "chore: remove temporary QA runner"
          git push origin main
