name: batch_10_11_12_finalize_v2

on:
  push:
    branches: [agent/v1-stabilization-integration]
    paths:
      - '.github/batch101112-v2-trigger.txt'
      - '.github/workflows/temp-batch101112-v2.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1-stabilization-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch dashboard integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/pages/AdminDashboard.jsx')
          s=p.read_text()
          anchor="import CustomerCRMInsights from '../components/CustomerCRMInsights';"
          if "../components/PremiumFinanceReport" not in s:
            s=s.replace(anchor, anchor+"\nimport PremiumFinanceReport from '../components/PremiumFinanceReport';\nimport OnboardingProgressCard from '../components/OnboardingProgressCard';\nimport SecurityReadinessPanel from '../components/SecurityReadinessPanel';")
          onboard="<OnboardingProgressCard tenant={tenant} users={users} products={products} services={services} setActiveTab={setActiveTab} />"
          if onboard not in s:
            a=s.find("            {/* INTERACTIVE EMPTY STATE PROGRESS BAR (If no data) */}")
            b=s.find("            {/* METRICS CARDS: HARI INI */}", a)
            if a == -1 or b == -1: raise SystemExit('onboarding block marker not found')
            s=s[:a]+"            "+onboard+"\n\n"+s[b:]
          finance="<PremiumFinanceReport transactions={transactions} services={services} products={products} users={users} tenant={tenant} />"
          if finance not in s:
            i=s.find("activeTab === 'keuangan' ? (")
            if i == -1: i=s.find('activeTab === "keuangan" ? (')
            if i == -1: raise SystemExit('finance marker not found')
            d=s.find('<div', i)
            g=s.find('>', d)
            if d == -1 or g == -1: raise SystemExit('finance div not found')
            inject='\n            '+finance+'\n            <SecurityReadinessPanel tenant={tenant} users={users} products={products} services={services} transactions={transactions} />'
            s=s[:g+1]+inject+s[g+1:]
          p.write_text(s)
          cssp=Path('src/index.css')
          css=cssp.read_text()
          block='''\n\n/* Batch 10-12 owner report, onboarding, and readiness polish */\n@media (max-width: 860px) {\n  .premium-finance-grid { grid-template-columns: 1fr !important; }\n}\n'''
          if 'Batch 10-12 owner report' not in css:
            cssp.write_text(css.rstrip()+block+'\n')
          PY
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit and cleanup
        run: |
          git config user.name "aiserviceid"
          git config user.email "ai.interiorid@gmail.com"
          git add src/pages/AdminDashboard.jsx src/index.css
          git rm -f .github/workflows/temp-batch101112-v2.yml .github/batch101112-v2-trigger.txt --ignore-unmatch || true
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "feat: integrate owner report onboarding and security readiness"
          git pull --rebase origin agent/v1-stabilization-integration
          git push origin HEAD:agent/v1-stabilization-integration
