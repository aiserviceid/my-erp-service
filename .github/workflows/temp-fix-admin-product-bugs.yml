name: Fix Admin Product Bugs

on:
  push:
    branches:
      - agent/v1-stabilization-integration

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1-stabilization-integration
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch product persistence and admin selesai billing flow
        run: |
          python <<'PY'
          from pathlib import Path

          api_path = Path('src/services/api.js')
          api = api_path.read_text()

          old_map = """return (data || []).map(p => ({
                  ...p,
                  imageUrl: p.imageUrl || p.image_url || p.image || ''
                }));"""
          new_map = """return (data || []).map(p => ({
                  ...p,
                  category: p.category || 'SPAREPART',
                  imageUrl: p.imageUrl || p.image_url || p.image || ''
                }));"""
          if old_map in api:
            api = api.replace(old_map, new_map)

          old_retry = """        const retryRes = await supabase
                  .from('products')
                  .insert(fallbackPayload)
                  .select()
                  .single();

                if (retryRes.error) {
                  console.warn('Fallback product insert error:', retryRes.error);
                  return {
                    id: `PROD-${Date.now()}`,
                    tenant_code: productData.tenant_code,
                    name: cleanName,
                    price: cleanPrice,
                    stock: cleanStock,
                    category: cleanCat,
                    imageUrl: img
                  };
                }
                inserted = retryRes.data;"""
          new_retry = """        let retryRes = await supabase
                  .from('products')
                  .insert(fallbackPayload)
                  .select()
                  .single();

                if (retryRes.error && fallbackPayload.image_url) {
                  console.warn('Fallback product insert with image_url error:', retryRes.error);
                  const basicPayload = {
                    tenant_code: productData.tenant_code,
                    name: cleanName,
                    price: cleanPrice,
                    stock: cleanStock
                  };
                  retryRes = await supabase
                    .from('products')
                    .insert(basicPayload)
                    .select()
                    .single();
                }

                if (retryRes.error) {
                  console.warn('Fallback product insert error:', retryRes.error);
                  throw new Error(`Barang gagal disimpan ke database: ${retryRes.error.message || 'schema products tidak cocok'}`);
                }
                inserted = retryRes.data;"""
          if old_retry not in api:
            raise SystemExit('Fallback product block not found')
          api = api.replace(old_retry, new_retry)

          old_catch = """    } catch (e) {
                console.error('addProduct exception:', e);
                return {
                  id: `PROD-${Date.now()}`,
                  tenant_code: productData.tenant_code,
                  name: productData.name,
                  price: Number(productData.price) || 0,
                  stock: Number(productData.stock) || 0,
                  category: productData.category || 'SPAREPART',
                  imageUrl: productData.imageUrl || ''
                };
              }
            },"""
          new_catch = """    } catch (e) {
                console.error('addProduct exception:', e);
                throw e;
              }
            },"""
          if old_catch not in api:
            raise SystemExit('addProduct fake success catch not found')
          api = api.replace(old_catch, new_catch)
          api_path.write_text(api)

          admin_path = Path('src/pages/AdminDashboard.jsx')
          admin = admin_path.read_text()

          old_payload = """const updatedService = await apiService.post('/services/update', {
                resi: selectedService.resi,
                tenant_code: selectedService.tenant_code || tenant?.code,
                part_fee: partFee,
                jasa_fee: jasaFee,
                issue: updatedIssue
              });
              const nextService = { ...selectedService, ...updatedService, part_fee: partFee, jasa_fee: jasaFee, issue: updatedIssue };"""
          new_payload = """const shouldMarkSelesai = Boolean(selectedService.__markSelesaiFromAdmin);
              const updatedService = await apiService.post('/services/update', {
                resi: selectedService.resi,
                tenant_code: selectedService.tenant_code || tenant?.code,
                ...(shouldMarkSelesai ? { status: 'SELESAI' } : {}),
                part_fee: partFee,
                jasa_fee: jasaFee,
                issue: updatedIssue
              });
              const nextService = { ...selectedService, ...updatedService, ...(shouldMarkSelesai ? { status: 'SELESAI' } : {}), part_fee: partFee, jasa_fee: jasaFee, issue: updatedIssue };"""
          if old_payload not in admin:
            raise SystemExit('Admin edit nota payload block not found')
          admin = admin.replace(old_payload, new_payload)
          admin = admin.replace("alert('Nota servis berhasil dikoreksi.');", "alert(selectedService.__markSelesaiFromAdmin ? 'Rincian tagihan berhasil disimpan dan status menjadi Selesai.' : 'Nota servis berhasil dikoreksi.');")

          old_action = """  const updateServiceStatusFromAction = async (service, newStatus) => {
              try {
                await apiService.post('/services/update', { resi: service.resi, status: newStatus });
                setServices(services.map((item) => item.resi === service.resi ? { ...item, status: newStatus } : item));"""
          new_action = """  const updateServiceStatusFromAction = async (service, newStatus) => {
              if (newStatus === 'SELESAI') {
                setSelectedService({ ...service, __markSelesaiFromAdmin: true });
                setShowEditServiceNota(true);
                return;
              }
              if ((newStatus === 'DIAMBIL' || newStatus === 'DI AMBIL') && !service.part_fee && !service.jasa_fee) {
                alert('Isi rincian biaya servis lewat status Selesai terlebih dahulu sebelum menandai Diambil.');
                return;
              }
              try {
                const canonicalStatus = newStatus === 'DI AMBIL' ? 'DIAMBIL' : newStatus;
                await apiService.post('/services/update', { resi: service.resi, tenant_code: service.tenant_code || tenant?.code, status: canonicalStatus });
                setServices(services.map((item) => item.resi === service.resi ? { ...item, status: canonicalStatus } : item));"""
          if old_action not in admin:
            raise SystemExit('Admin status action block not found')
          admin = admin.replace(old_action, new_action)
          admin = admin.replace("*${getStatusInfo(newStatus).label}*", "*${getStatusInfo(canonicalStatus).label}*")

          old_inline = """onChange={async (e) => {
                                  const newStatus = e.target.value;
                                  try {
                                    await apiService.post('/services/update', { resi: s.resi, status: newStatus });
                                    setServices(services.map(srv => srv.resi === s.resi ? { ...srv, status: newStatus } : srv));
                                    if (hasFeature(tenant?.tier, 'whatsappNotif') && confirm('Kirim update status ke WhatsApp pelanggan?')) {
                                      const storeName = tenant?.settings?.storeName || tenant?.name || 'Toko Servis';
                                      const trackingUrl = `${window.location.origin}/tracking?resi=${s.resi}`;
                                      const msg = `Halo Kak ${s.customer_name}, ini update status servis ${s.device_name} Anda (Resi: ${s.resi}) dari *${storeName}* saat ini: *${getStatusInfo(newStatus).label}*.

Klik link ini untuk cek status langsung dari HP:
${trackingUrl}`;
                                      await sendWhatsAppNotification({ tenant, target: s.customer_phone, message: msg, openManual: true });
                                    }
                                  } catch(err) { alert('Gagal update status'); }
                                }}"""
          new_inline = """onChange={(e) => updateServiceStatusFromAction(s, e.target.value)}"""
          if old_inline not in admin:
            raise SystemExit('Admin inline status handler not found')
          admin = admin.replace(old_inline, new_inline)

          old_add_ui = """const newProd = await apiService.addProduct({ tenant_code: tenant.code, name, price, stock: stock || 0, category, imageUrl }, currentUser);
                        setProducts([...products, { ...newProd, imageUrl }]);"""
          new_add_ui = """const newProd = await apiService.addProduct({ tenant_code: tenant.code, name, price, stock: stock || 0, category, imageUrl }, currentUser);
                        const savedProduct = { ...newProd, category: newProd.category || category, imageUrl: newProd.imageUrl || newProd.image_url || imageUrl };
                        setProducts(prev => [savedProduct, ...prev.filter(p => String(p.id) !== String(savedProduct.id))]);
                        apiService.getProducts(tenant.code).then(setProducts).catch(() => {});"""
          if old_add_ui not in admin:
            raise SystemExit('Admin add product UI block not found')
          admin = admin.replace(old_add_ui, new_add_ui)
          admin_path.write_text(admin)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit source changes
        run: |
          git config user.name "aiserviceid"
          git config user.email "ai.interiorid@gmail.com"
          rm -f .github/workflows/temp-fix-admin-product-bugs.yml .github/fix-admin-product-bugs-trigger.txt
          git add -A
          git commit -m "fix: persist products and open billing details on admin selesai"
          git push
