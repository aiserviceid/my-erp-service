name: Fix Admin Product Bugs

on:
  push:
    branches:
      - agent/v1-stabilization-integration

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1-stabilization-integration
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch source files
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          api_path = Path('src/services/api.js')
          api = api_path.read_text()
          api = api.replace("        ...p,\n        imageUrl: p.imageUrl || p.image_url || p.image || ''", "        ...p,\n        category: p.category || 'SPAREPART',\n        imageUrl: p.imageUrl || p.image_url || p.image || ''")
          api, n1 = re.subn(r"if \(retryRes\.error\) \{\s*console\.warn\('Fallback product insert error:', retryRes\.error\);\s*return \{\s*id: `PROD-\$\{Date\.now\(\)\}`,\s*tenant_code: productData\.tenant_code,\s*name: cleanName,\s*price: cleanPrice,\s*stock: cleanStock,\s*category: cleanCat,\s*imageUrl: img\s*\};\s*\}", "if (retryRes.error) {\n          console.warn('Fallback product insert error:', retryRes.error);\n          throw new Error(`Barang gagal disimpan ke database: ${retryRes.error.message || 'schema products tidak cocok'}`);\n        }", api, count=1, flags=re.S)
          if n1 != 1:
            raise SystemExit(f'Product fake fallback block not replaced: {n1}')
          api, n2 = re.subn(r"\} catch \(e\) \{\s*console\.error\('addProduct exception:', e\);\s*return \{\s*id: `PROD-\$\{Date\.now\(\)\}`,\s*tenant_code: productData\.tenant_code,\s*name: productData\.name,\s*price: Number\(productData\.price\) \|\| 0,\s*stock: Number\(productData\.stock\) \|\| 0,\s*category: productData\.category \|\| 'SPAREPART',\s*imageUrl: productData\.imageUrl \|\| ''\s*\};\s*\}\s*\},", "} catch (e) {\n      console.error('addProduct exception:', e);\n      throw e;\n    }\n  },", api, count=1, flags=re.S)
          if n2 != 1:
            raise SystemExit(f'Product catch block not replaced: {n2}')
          api_path.write_text(api)

          admin_path = Path('src/pages/AdminDashboard.jsx')
          admin = admin_path.read_text()
          admin = admin.replace("tenant_code: selectedService.tenant_code || tenant?.code,\n        part_fee: partFee,", "tenant_code: selectedService.tenant_code || tenant?.code,\n        ...(selectedService.__markSelesaiFromAdmin ? { status: 'SELESAI' } : {}),\n        part_fee: partFee,")
          admin = admin.replace("const nextService = { ...selectedService, ...updatedService, part_fee: partFee,", "const nextService = { ...selectedService, ...updatedService, ...(selectedService.__markSelesaiFromAdmin ? { status: 'SELESAI' } : {}), part_fee: partFee,")
          admin = admin.replace("alert('Nota servis berhasil dikoreksi.');", "alert(selectedService.__markSelesaiFromAdmin ? 'Rincian tagihan berhasil disimpan dan status menjadi Selesai.' : 'Nota servis berhasil dikoreksi.');")
          admin = admin.replace("  const updateServiceStatusFromAction = async (service, newStatus) => {\n    try {", "  const updateServiceStatusFromAction = async (service, newStatus) => {\n    if (newStatus === 'SELESAI') {\n      setSelectedService({ ...service, __markSelesaiFromAdmin: true });\n      setShowEditServiceNota(true);\n      return;\n    }\n    if ((newStatus === 'DIAMBIL' || newStatus === 'DI AMBIL') && !service.part_fee && !service.jasa_fee) {\n      alert('Isi rincian biaya servis lewat status Selesai terlebih dahulu sebelum menandai Diambil.');\n      return;\n    }\n    try {")
          admin, n3 = re.subn(r"onChange=\{async \(e\) => \{\s*const newStatus = e\.target\.value;\s*try \{\s*await apiService\.post\('/services/update', \{ resi: s\.resi, status: newStatus \}\);.*?\} catch\(err\) \{ alert\('Gagal update status'\); \}\s*\}\}", "onChange={(e) => updateServiceStatusFromAction(s, e.target.value)}", admin, count=1, flags=re.S)
          if n3 != 1:
            raise SystemExit(f'Admin inline status handler not replaced: {n3}')
          admin = admin.replace("const newProd = await apiService.addProduct({ tenant_code: tenant.code, name, price, stock: stock || 0, category, imageUrl }, currentUser);\n                        setProducts([...products, { ...newProd, imageUrl }]);", "const newProd = await apiService.addProduct({ tenant_code: tenant.code, name, price, stock: stock || 0, category, imageUrl }, currentUser);\n                        const savedProduct = { ...newProd, category: newProd.category || category, imageUrl: newProd.imageUrl || newProd.image_url || imageUrl };\n                        setProducts(prev => [savedProduct, ...prev.filter(p => String(p.id) !== String(savedProduct.id))]);\n                        apiService.getProducts(tenant.code).then(setProducts).catch(() => {});")
          admin_path.write_text(admin)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit source changes
        run: |
          git config user.name "aiserviceid"
          git config user.email "ai.interiorid@gmail.com"
          rm -f .github/workflows/temp-fix-admin-product-bugs.yml .github/fix-admin-product-bugs-trigger.txt
          git add -A
          git commit -m "fix: persist products and open billing details on admin selesai"
          git push
