name: Dashboard Trend Card Build

on:
  push:
    branches:
      - agent/v1-stabilization-integration
    paths:
      - '.github/dashboard-trend-card-trigger.txt'

jobs:
  build-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Clean temp workflow
        if: always()
        run: |
          git config user.name "aiserviceid"
          git config user.email "ai.interiorid@gmail.com"
          git rm .github/workflows/temp-dashboard-trend-card-build.yml .github/dashboard-trend-card-trigger.txt || true
          git commit -m "chore: clean dashboard trend temp workflow" || echo "nothing to commit"
          git push || true
