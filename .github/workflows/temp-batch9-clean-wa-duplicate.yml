name: temp_batch9_clean_wa_duplicate

on:
  push:
    branches:
      - agent/v1-stabilization-integration
    paths:
      - '.github/batch9-clean-wa-duplicate-trigger.txt'
      - '.github/workflows/temp-batch9-clean-wa-duplicate.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1-stabilization-integration
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Remove old WA composer duplicate
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          admin = Path('src/pages/AdminDashboard.jsx')
          text = admin.read_text()
          pattern = r'\n\s*\{/\* WHATSAPP MARKETING COMPOSER \*/\}\n\s*<details className="customer-blast-disclosure" id="customerBlastComposer">[\s\S]*?</details>\n'
          new_text, count = re.subn(pattern, '\n', text, count=1)
          if count == 0:
              print('Old WA composer block not found; no source change needed')
          else:
              admin.write_text(new_text)
              print('Removed old WA composer block')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit and cleanup
        run: |
          git config user.name "aiserviceid"
          git config user.email "ai.interiorid@gmail.com"
          git add src/pages/AdminDashboard.jsx
          git rm -f .github/workflows/temp-batch9-clean-wa-duplicate.yml .github/batch9-clean-wa-duplicate-trigger.txt --ignore-unmatch || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: remove duplicate WhatsApp marketing composer"
          git pull --rebase origin agent/v1-stabilization-integration
          git push origin HEAD:agent/v1-stabilization-integration
