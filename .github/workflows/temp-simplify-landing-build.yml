name: simplify_landing_build

on:
  push:
    branches:
      - agent/landing-page-simplify
    paths:
      - '.github/workflows/temp-simplify-landing-build.yml'
      - '.github/simplify-landing-trigger.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/landing-page-simplify
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Build app
        run: npm run build
      - name: Cleanup temporary workflow
        if: always()
        run: |
          git config user.name "aiserviceid"
          git config user.email "ai.interiorid@gmail.com"
          git rm --ignore-unmatch .github/workflows/temp-simplify-landing-build.yml .github/simplify-landing-trigger.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: cleanup simplify landing build workflow"
          git pull --rebase origin agent/landing-page-simplify
          git push origin HEAD:agent/landing-page-simplify
