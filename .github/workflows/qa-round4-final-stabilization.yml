name: QA Round 4 Final Stabilization

on:
  push:
    branches:
      - agent/qa-round4-final-stabilization
    paths:
      - scripts/apply-qa-round4-final-stabilization.py
      - .github/workflows/qa-round4-final-stabilization.yml

permissions:
  contents: write

jobs:
  verify-fix-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stabilization branch
        uses: actions/checkout@v4
        with:
          ref: agent/qa-round4-final-stabilization
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply Round 4 fixes
        run: python3 scripts/apply-qa-round4-final-stabilization.py

      - name: Normalize exact-resi matcher helper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('src/utils/financeUtils.js')
          text = path.read_text(encoding='utf-8')
          pattern = r"export const transactionMatchesServiceResi = \(description = '', resi = ''\) => \{.*?\n\};\n\n"
          replacement = """export const transactionMatchesServiceResi = (description = '', resi = '') => {
            const source = String(description || '').toUpperCase();
            const serviceResi = String(resi || '').trim().toUpperCase();
            if (!serviceResi) return false;
            const markers = [`RESI ${serviceResi}`, `RESI: ${serviceResi}`, `RESI:${serviceResi}`];
            return markers.some((marker) => {
              const index = source.indexOf(marker);
              if (index < 0) return false;
              const nextChar = source[index + marker.length] || '';
              return !/[A-Z0-9_-]/.test(nextChar);
            });
          };

          """
          updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
            raise SystemExit(f'exact-resi helper normalization expected 1 match, got {count}')
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Finance and idempotence smoke tests
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {
            allocateServiceDiscount,
            normalizeKasbonAmount,
            transactionMatchesServiceResi,
          } from './src/utils/financeUtils.js';

          assert.equal(normalizeKasbonAmount('50.000', 'BON_PENDING'), 50000);
          assert.equal(normalizeKasbonAmount(50, 'BON_KARYAWAN'), 50000);

          const a = allocateServiceDiscount(200000, 100000, 150000);
          assert.equal(a.jasaAfterDiscount, 0);
          assert.equal(a.partAfterDiscount, 150000);
          assert.equal(a.totalAfterDiscount, 150000);

          const b = allocateServiceDiscount(200000, 100000, 50000);
          assert.equal(b.jasaAfterDiscount, 50000);
          assert.equal(b.partAfterDiscount, 200000);
          assert.equal(b.totalAfterDiscount, 250000);

          const c = allocateServiceDiscount(100000, 100000, 200000);
          assert.equal(c.totalAfterDiscount, 0);

          assert.equal(transactionMatchesServiceResi('Jasa Servis Resi TRX-123 (Budi)', 'TRX-123'), true);
          assert.equal(transactionMatchesServiceResi('Pembayaran Servis Resi: TRX-123', 'TRX-123'), true);
          assert.equal(transactionMatchesServiceResi('Jasa Servis Resi TRX-1234 (Budi)', 'TRX-123'), false);
          assert.equal(transactionMatchesServiceResi('Jasa Servis Resi TRX-123-ABC', 'TRX-123'), false);
          console.log('Round 4 finance/idempotence smoke tests passed.');
          NODE

      - name: Static regression guards
        shell: bash
        run: |
          grep -q "settleServicePickup" src/pages/AdminDashboard.jsx
          grep -q "alreadySettledBefore" src/services/api.js
          grep -q "partAfterDiscount" src/services/api.js
          grep -q "transactionMatchesServiceResi" src/services/api.js
          grep -q "tenant_code: tenant.code" src/pages/AdminDashboard.jsx
          grep -q "tenant_code: employee.tenant_code || tenant.code" src/pages/EmployeePortal.jsx
          grep -q "String(s.technician_id) === String(employee.id)" src/pages/EmployeePortal.jsx
          grep -q "!isPaidServiceStatus(s.status)" src/pages/EmployeePortal.jsx
          ! grep -q "await apiService.post('/services/update', { resi: service.resi, status: newStatus });" src/pages/AdminDashboard.jsx
          ! grep -q 'await apiService.post(`/services/${s.resi}/status`, { status: newStatus });' src/pages/EmployeePortal.jsx

      - name: Install dependencies
        run: npm ci

      - name: Build production app
        run: npm run build

      - name: Commit verified product fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No product changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/financeUtils.js src/services/api.js src/pages/AdminDashboard.jsx src/pages/EmployeePortal.jsx
          git commit -m "fix(qa): harden settlement and tenant-scoped service flow"
          git push origin HEAD:agent/qa-round4-final-stabilization
