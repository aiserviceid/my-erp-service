name: official_logo_build

on:
  push:
    branches:
      - agent/unitpro-official-logo
    paths:
      - '.github/workflows/temp-official-logo-build.yml'
      - '.github/official-logo-trigger.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unitpro-official-logo
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch landing logo usage
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/LandingPage.jsx')
          s = p.read_text()
          s = s.replace('<UnitProLogo size={42} />', '<UnitProLogo size={54} wordmark />')
          s = s.replace('          <BrandLogo />\n          <span>Unit<strong>Pro</strong></span>\n', '          <BrandLogo />\n')
          p.write_text(s)

          css = Path('src/pages/LandingPage.css')
          c = css.read_text()
          c = c.replace('.simple-brand-logo { display: inline-flex; align-items: center; }', '.simple-brand-logo { display: inline-flex; align-items: center; width: 205px; max-width: 48vw; }\n.simple-brand-logo img { width: 100% !important; height: auto !important; }')
          css.write_text(c)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build app
        run: npm run build
      - name: Cleanup temporary workflow
        if: always()
        run: |
          git config user.name "aiserviceid"
          git config user.email "ai.interiorid@gmail.com"
          git add src/pages/LandingPage.jsx src/pages/LandingPage.css src/components/UnitProLogo.jsx
          git rm --ignore-unmatch .github/workflows/temp-official-logo-build.yml .github/official-logo-trigger.txt
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: use official UnitPro logo on landing page"
          git pull --rebase origin agent/unitpro-official-logo
          git push origin HEAD:agent/unitpro-official-logo
