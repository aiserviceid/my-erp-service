name: package_final_adjust

on:
  push:
    branches:
      - agent/sync-packages-landing
    paths:
      - '.github/workflows/temp-package-final-adjust.yml'
      - '.github/package-final-adjust-trigger.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sync-packages-landing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply final package adjustment
        run: python .github/patch-package-final-adjust.py
      - name: Install dependencies
        run: npm ci
      - name: Build app
        run: npm run build
      - name: Cleanup temporary files
        if: always()
        run: |
          rm -f .github/patch-package-final-adjust.py
          rm -f .github/package-final-adjust-trigger.txt
          rm -f .github/workflows/temp-package-final-adjust.yml
          git config user.name "aiserviceid"
          git config user.email "ai.interiorid@gmail.com"
          git add .
          git commit -m "chore: cleanup final package adjustment workflow" || true
          git push
