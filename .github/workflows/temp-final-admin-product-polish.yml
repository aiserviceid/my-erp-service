name: Final Admin Product Polish

on:
  push:
    branches:
      - agent/v1-stabilization-integration

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1-stabilization-integration
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch source files
        run: |
          python <<'PY'
          from pathlib import Path

          api_path = Path('src/services/api.js')
          api = api_path.read_text()
          old_api = """        const retryRes = await supabase
          .from('products')
          .insert(fallbackPayload)
          .select()
          .single();

        if (retryRes.error) {
          console.warn('Fallback product insert error:', retryRes.error);
          throw new Error(`Barang gagal disimpan ke database: ${retryRes.error.message || 'schema products tidak cocok'}`);
        }
        inserted = retryRes.data;"""
          new_api = """        let retryRes = await supabase
          .from('products')
          .insert(fallbackPayload)
          .select()
          .single();

        if (retryRes.error && fallbackPayload.image_url) {
          console.warn('Fallback product insert with image_url error:', retryRes.error);
          const basicPayload = {
            tenant_code: productData.tenant_code,
            name: cleanName,
            price: cleanPrice,
            stock: cleanStock
          };
          retryRes = await supabase
            .from('products')
            .insert(basicPayload)
            .select()
            .single();
        }

        if (retryRes.error) {
          console.warn('Fallback product insert error:', retryRes.error);
          throw new Error(`Barang gagal disimpan ke database: ${retryRes.error.message || 'schema products tidak cocok'}`);
        }
        inserted = retryRes.data;"""
          if old_api not in api:
            raise SystemExit('api fallback block not found')
          api = api.replace(old_api, new_api)
          api_path.write_text(api)

          admin_path = Path('src/pages/AdminDashboard.jsx')
          admin = admin_path.read_text()
          old_admin = """    try {
      await apiService.post('/services/update', { resi: service.resi, status: newStatus });
      setServices(services.map((item) => item.resi === service.resi ? { ...item, status: newStatus } : item));"""
          new_admin = """    try {
      const canonicalStatus = newStatus === 'DI AMBIL' ? 'DIAMBIL' : newStatus;
      await apiService.post('/services/update', { resi: service.resi, tenant_code: service.tenant_code || tenant?.code, status: canonicalStatus });
      setServices(services.map((item) => item.resi === service.resi ? { ...item, status: canonicalStatus } : item));"""
          if old_admin not in admin:
            raise SystemExit('admin status update block not found')
          admin = admin.replace(old_admin, new_admin)
          admin = admin.replace('getStatusInfo(newStatus).label', 'getStatusInfo(canonicalStatus).label')
          admin_path.write_text(admin)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit source changes
        run: |
          git config user.name "aiserviceid"
          git config user.email "ai.interiorid@gmail.com"
          rm -f .github/workflows/temp-final-admin-product-polish.yml .github/final-admin-product-polish-trigger.txt
          git add -A
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: harden admin status update and product insert fallback"
          git pull --rebase origin agent/v1-stabilization-integration
          git push origin HEAD:agent/v1-stabilization-integration
