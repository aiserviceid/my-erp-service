name: Menu Label Polish

on:
  push:
    branches:
      - agent/v1-stabilization-integration

jobs:
  polish-build-clean:
    if: contains(github.event.head_commit.message, 'trigger menu label polish workflow')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1-stabilization-integration
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Polish employee portal labels
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('src/pages/EmployeePortal.jsx')
          text = p.read_text()
          replacements = {
            '<h2>Portal Karyawan</h2>': '<h2>Area Tim</h2>',
            "tenant?.name || 'Masuk sebagai Karyawan'": "tenant?.name || 'Masuk ke Area Tim'",
            'Mode Simulasi Kasir & Teknisi Aktif': 'Mode Demo Tim Aktif',
            'placeholder="Masukkan PIN Anda"': 'placeholder="PIN Tim"',
            "{ id: 'servis', name: 'Servis & Teknisi', icon: Wrench }": "{ id: 'servis', name: 'Alur Servis', icon: Wrench }",
            "{ id: 'tugas', name: 'Tugas', icon: Wrench }": "{ id: 'tugas', name: 'Servis', icon: Wrench }",
            "{ id: 'keuangan', name: 'Keuangan', icon: Wallet }": "{ id: 'keuangan', name: 'Komisi', icon: Wallet }",
            "<p>{isKasir ? 'AREA KASIR' : 'AREA KARYAWAN'}</p>": "<p>{isKasir ? 'AREA KASIR' : 'AREA TIM'}</p>",
            "<h2>{isKasir ? 'Kasir & Servis' : 'Tugas Hari Ini'}</h2>": "<h2>{isKasir ? 'Kasir & Alur Servis' : 'Servis Hari Ini'}</h2>",
            "Kembali ke Beranda": "Kembali ke UnitPro",
          }
          for old, new in replacements.items():
            text = text.replace(old, new)
          p.write_text(text)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit polished labels and clean temp files
        run: |
          git config user.name "UnitPro Agent"
          git config user.email "unitpro-agent@users.noreply.github.com"
          rm -f .github/workflows/temp-menu-label-polish.yml .github/menu-label-polish-trigger.txt
          git add src/pages/EmployeePortal.jsx .github/workflows/temp-menu-label-polish.yml .github/menu-label-polish-trigger.txt
          git commit -m "polish employee portal labels for APK" || exit 0
          git push origin HEAD:agent/v1-stabilization-integration
