name: Batch 9 WhatsApp Marketing Pro

on:
  push:
    branches:
      - agent/v1-stabilization-integration
    paths:
      - '.github/batch9-wa-marketing-trigger.txt'
      - '.github/workflows/temp-batch9-wa-marketing-build.yml'

permissions:
  contents: write

jobs:
  patch_build_clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1-stabilization-integration
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Add Batch 9 mobile CRM polish CSS
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('src/index.css')
          text = path.read_text()
          block = r'''

/* Batch 9 - WhatsApp Marketing Pro CRM polish */
.customer-segment-card.active {
  border-color: #0f766e !important;
  background: linear-gradient(135deg, #ecfdf5 0%, #eff6ff 100%) !important;
  box-shadow: 0 10px 26px rgba(15, 118, 110, 0.12);
}

.customer-wa-pro-panel .btn {
  min-height: 42px;
}

@media (max-width: 860px) {
  .customer-wa-pro-panel {
    grid-template-columns: 1fr !important;
  }
}

@media (max-width: 640px) {
  .customer-crm-insights {
    margin-top: 8px;
  }

  .customer-crm-metrics {
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
  }

  .customer-segment-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
  }

  .customer-wa-pro-panel {
    gap: 10px !important;
  }

  .customer-wa-pro-panel select,
  .customer-wa-pro-panel .btn {
    width: 100%;
  }
}
'''
          if 'Batch 9 - WhatsApp Marketing Pro CRM polish' not in text:
              path.write_text(text.rstrip() + block + '\n')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit and push with rebase
        run: |
          git config user.name "aiserviceid"
          git config user.email "ai.interiorid@gmail.com"
          git add src/index.css
          git rm -f .github/workflows/temp-batch9-wa-marketing-build.yml .github/batch9-wa-marketing-trigger.txt --ignore-unmatch || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: polish WhatsApp marketing CRM mobile UI"
          git pull --rebase origin agent/v1-stabilization-integration
          git push origin HEAD:agent/v1-stabilization-integration
