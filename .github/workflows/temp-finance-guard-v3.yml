name: Finance Guard V3

on:
  push:
    branches:
      - agent/finance-guard

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finance-guard
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply finance guard patch
        run: |
          echo '  ' | base64 -d > /tmp/finance_guard_patch.cjs
          node /tmp/finance_guard_patch.cjs
      - name: Validate build
        run: |
          npm ci
          npm run build
      - name: Commit source changes
        run: |
          git config user.name "aiserviceid"
          git config user.email "ai.interiorid@gmail.com"
          git add src/pages/EmployeePortal.jsx src/pages/AdminDashboard.jsx
          git add -u .github/workflows/temp-finance-guard.yml .github/workflows/temp-finance-guard-v2.yml .github/workflows/temp-finance-guard-v3.yml __finance_trigger__ __finance_trigger_v3__
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: guard service finance entries"
          git push
