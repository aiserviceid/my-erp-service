name: QA Priority Fixes

on:
  push:
    branches:
      - agent/qa-fix-priority-findings
    paths:
      - scripts/apply-qa-priority-fixes.py
      - scripts/run-qa-priority-fixes.py
      - src/utils/phoneUtils.js
      - src/utils/productCategory.js
      - .github/workflows/qa-priority-fixes.yml

permissions:
  contents: write

jobs:
  apply-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4
        with:
          ref: agent/qa-fix-priority-findings
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply QA fixes
        run: python3 scripts/run-qa-priority-fixes.py

      - name: Install dependencies
        run: npm ci

      - name: Build production app
        run: npm run build

      - name: Commit verified changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AdminDashboard.jsx src/components/PremiumFinanceReport.jsx src/components/POSView.jsx src/pages/EmployeePortal.jsx src/components/OnboardingProgressCard.jsx src/App.jsx src/store/useStore.js src/index.css
          git commit -m "fix(qa): priority findings [qa-fix applied]"
          git push origin HEAD:agent/qa-fix-priority-findings
