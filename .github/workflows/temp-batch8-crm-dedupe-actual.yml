name: Batch 8 CRM Dedupe Actual

on:
  push:
    paths:
      - '.github/workflows/temp-batch8-crm-dedupe-actual.yml'
      - '.github/batch8-crm-dedupe-actual-trigger.txt'

permissions:
  contents: write

jobs:
  patch_build_clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1-stabilization-integration
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Remove duplicated old CRM metric cards using actual marker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('src/pages/AdminDashboard.jsx')
          text = path.read_text()
          pattern = r"\n\s*\{/\* CRM Metrics Cards \*/\}\n\s*<div className=\"customer-metric-grid\"[\s\S]*?\n\s*\{/\* WHATSAPP MARKETING COMPOSER \*/\}"
          new_text, count = re.subn(pattern, "\n\n            {/* WHATSAPP MARKETING COMPOSER */}", text, count=1)
          print(f'removed duplicated CRM block count={count}')
          if count == 0:
              raise SystemExit('duplicated CRM block not found')
          new_text = new_text.replace("            {/* TABEL DATABASE PELANGGAN */}\n            {/* TABEL DATABASE PELANGGAN */}", "            {/* TABEL DATABASE PELANGGAN */}")
          path.write_text(new_text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit and push with rebase
        run: |
          git config user.name "aiserviceid"
          git config user.email "ai.interiorid@gmail.com"
          git add src/pages/AdminDashboard.jsx
          git commit -m "fix: remove duplicated customer crm cards"
          git rm -f --ignore-unmatch .github/workflows/temp-batch8-crm-dedupe-actual.yml .github/batch8-crm-dedupe-actual-trigger.txt
          git commit -m "chore: clean batch 8 crm actual workflow" || echo "No temp cleanup changes"
          git pull --rebase origin agent/v1-stabilization-integration
          git push origin HEAD:agent/v1-stabilization-integration
