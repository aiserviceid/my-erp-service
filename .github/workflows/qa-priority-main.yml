name: QA Priority Main Integration

on:
  push:
    branches:
      - agent/qa-priority-findings-main
    paths:
      - scripts/apply-qa-priority-main.py
      - .github/workflows/qa-priority-main.yml

permissions:
  contents: write

jobs:
  apply-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/qa-priority-findings-main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply QA priority fixes
        run: python3 scripts/apply-qa-priority-main.py

      - name: Static QA checks
        shell: bash
        run: |
          grep -q "TrackResiRedirect" src/App.jsx
          grep -q "products.length > 0" src/components/OnboardingProgressCard.jsx
          grep -q "normalizeProductCategory, isServiceItem" src/components/POSView.jsx
          grep -q "Sama dengan WA karyawan" src/components/PremiumFinanceReport.jsx
          grep -q "desktop admin sidebar must remain visible" src/index.css
          grep -q "customerPhoneConflictMessage" src/pages/AdminDashboard.jsx
          grep -q "normalizeWhatsAppNumber" src/pages/EmployeePortal.jsx
          grep -q "EMPLOYEE_TOKEN" src/store/useStore.js
          grep -q "PHYSICAL_CATEGORIES" src/utils/productCategory.js
          grep -q "findEmployeePhoneConflict" src/utils/phoneUtils.js
          ! grep -q "if (s.status !== 'SELESAI') return null" src/pages/EmployeePortal.jsx

      - name: Install dependencies
        run: npm ci

      - name: Build production app
        run: npm run build

      - name: Commit verified integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/components/OnboardingProgressCard.jsx src/components/POSView.jsx src/components/PremiumFinanceReport.jsx src/index.css src/pages/AdminDashboard.jsx src/pages/EmployeePortal.jsx src/store/useStore.js src/utils/phoneUtils.js src/utils/productCategory.js
          git commit -m "fix(qa): integrate priority findings on current main"
          git push origin HEAD:agent/qa-priority-findings-main
