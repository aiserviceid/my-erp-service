name: Run service flow fix

on:
  push:
    branches:
      - fix/service-flow-approval
    paths:
      - .github/service-flow-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/service-flow-approval
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply patch
        run: python scripts/apply-service-flow-fix.py
      - name: Install
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/config/tierLimits.js src/services/notificationService.js src/pages/AdminDashboard.jsx src/pages/EmployeePortal.jsx src/pages/PublicTracking.jsx
          git commit -m "fix: align service status flow and approval WhatsApp"
          git push origin HEAD:fix/service-flow-approval
